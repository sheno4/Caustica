import dev.comfyfluffy.caustica.slangtooling.GenerateRtBindings
import dev.comfyfluffy.caustica.slangtooling.GenerateShaderRecords
import dev.comfyfluffy.caustica.slangtooling.CompileSlangShaders

plugins {
    id "java-library"
    id "maven-publish"
    id "dev.comfyfluffy.caustica.slang-tooling"
}

version = project.api_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

base { archivesName = "caustica-renderer-raytracing" }
repositories { mavenCentral() }

configurations {
    slangShaderModules {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def osArch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
def lwjglTestNatives = null
if (osName.contains("windows")) {
    lwjglTestNatives = osArch.contains("aarch64") ? "natives-windows-arm64" : "natives-windows"
} else if (osName.contains("mac")) {
    lwjglTestNatives = osArch.contains("aarch64") ? "natives-macos-arm64" : "natives-macos"
} else if (osName.contains("linux")) {
    lwjglTestNatives = osArch.contains("aarch64") ? "natives-linux-arm64"
            : osArch.startsWith("arm") ? "natives-linux-arm32" : "natives-linux"
}

dependencies {
    api project(":packages:engine")
    api project(":packages:engine-vulkan")
    api project(":packages:slang-runtime")
    implementation project(":packages:vulkan-support")
    implementation project(":packages:api-support")
    implementation "org.slf4j:slf4j-api:2.0.17"

    runtimeOnly project(":packages:shader-api")
    runtimeOnly project(":packages:features-builtin")
    slangShaderModules project(path: ":packages:shader-api", configuration: "runtimeElements")
    slangShaderModules project(path: ":packages:features-builtin", configuration: "runtimeElements")

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    if (lwjglTestNatives != null) {
        testRuntimeOnly "org.lwjgl:lwjgl:${project.lwjgl_version}:${lwjglTestNatives}"
    }
}

def worldShaderNames = [
        "bindings.slang", "closest_hit.slang", "fixed_composition.slang", "guide.rmiss.slang",
        "indirect.slang", "indirect_ser.slang", "nee_at_bake.slang", "path_queue_types.slang",
        "primary_reflection.rgen.slang", "primary_rgen.slang", "radiance_any_hit.rahit.slang",
        "retained_indirect.slang", "retained_lights.slang", "retained_path_queue.slang",
        "retained_trace_ordinary.slang", "retained_trace_policy.slang",
        "retained_trace_reordered.slang", "shadow_any_hit.rahit.slang", "sky_miss.slang",
        "stable_planes.slang", "stable_plane_types.slang", "surface_bsdf.slang", "nrd_signals.slang",
        "world_common.slang", "world_minimal.slang"
] as Set

def worldShaderModules = file("src/main/resources/caustica/shaders/world")
def generatedShaderResources = layout.buildDirectory.dir("generated/resources")
def compileRayTracingShaders = tasks.register("compileRayTracingShaders", CompileSlangShaders) {
    group = "build"
    description = "Compiles and validates the ray renderer's compute shaders."
    sourceDirectory = file("shaders")
    includeDirectories.from(worldShaderModules, configurations.slangShaderModules)
    aliasSourceDirectory = worldShaderModules
    outputDirectory = generatedShaderResources.map { it.dir("caustica/shaders") }
}
def reflectionRoot = layout.buildDirectory.dir("generated/reflection-sources")
def prepareRayTracingReflectionSources = tasks.register("prepareRayTracingReflectionSources", Sync) {
    from(worldShaderModules) { into "pipelines/world" }
    from(file("src/shaderReflection")) { into "layout" }
    into(reflectionRoot)
}

def rayTracingRecordSpecs = [
        "buffer|worldPushLayoutProbe|WorldPush|dev.comfyfluffy.caustica.renderer.raytracing.gen|WorldPushData|false",
        "buffer|retainedGeometryRecordLayoutProbe|RetainedGeometryRecord|dev.comfyfluffy.caustica.renderer.raytracing.gen|RetainedGeometryRecordData|false",
        "buffer|retainedLightRecordLayoutProbe|RetainedLightRecord|dev.comfyfluffy.caustica.renderer.raytracing.gen|RetainedLightRecordData|false",
        "buffer|neeAtStateLayoutProbe|NeeAtState|dev.comfyfluffy.caustica.renderer.raytracing.gen|NeeAtStateData|false",
        "buffer|packedPathSegmentLayoutProbe|PackedPathSegment|dev.comfyfluffy.caustica.renderer.raytracing.gen|PackedPathSegmentData|false",
        "buffer|stablePlaneRecordLayoutProbe|StablePlaneRecord|dev.comfyfluffy.caustica.renderer.raytracing.gen|StablePlaneRecordData|false"
]
def generatedRecordRoot = layout.buildDirectory.dir("generated/sources/shaderRecords")
def generateRayTracingRecords = tasks.register("generateRayTracingRecords", GenerateShaderRecords) {
    group = "build"
    description = "Generates the ray-tracing-owned host records from Slang reflection."
    dependsOn(prepareRayTracingReflectionSources)
    shaderRoot = reflectionRoot
    probeSource = reflectionRoot.map { it.file("layout/raytracing_probe.slang") }
    includeDirectories.from(configurations.slangShaderModules)
    recordSpecs = rayTracingRecordSpecs
    outDir = generatedRecordRoot
}

def generatedBindingsRoot = layout.buildDirectory.dir("generated/sources/rtBindings")
def generateRayTracingBindings = tasks.register("generateRayTracingBindings", GenerateRtBindings) {
    group = "build"
    description = "Generates the descriptor-heap world roots from primary ray reflection."
    dependsOn(prepareRayTracingReflectionSources)
    shaderRoot = reflectionRoot
    includeDirectories.from(configurations.slangShaderModules)
    javaPackage = "dev.comfyfluffy.caustica.renderer.raytracing.layout"
    outDir = generatedBindingsRoot
}

sourceSets.main.java.srcDir(files(generatedRecordRoot).builtBy(generateRayTracingRecords))
sourceSets.main.java.srcDir(files(generatedBindingsRoot).builtBy(generateRayTracingBindings))
sourceSets.main.resources.srcDir(files(generatedShaderResources).builtBy(compileRayTracingShaders))

def verifyRayTracingAbi = tasks.register("verifyRayTracingAbi") {
    group = "verification"
    description = "Verifies exact host layouts reflected from ray-tracing Slang records."
    dependsOn(generateRayTracingRecords, generateRayTracingBindings)
    def expectedFragments = [
            WorldPushData: ["BYTE_SIZE = 304", "invViewProj().get(0, dst)",
                            "putFloat(64, camOffset().x())", "putInt(76, frameIndex())",
                            "prevViewProj().get(80, dst)", "putInt(168, flags())",
                            "putFloat(176, time())", "curViewProj().get(208, dst)",
                            "putFloat(276, preExposure())", "putLong(280, environmentBinding())",
                            "putInt(288, environmentImplementation())"],
            RetainedGeometryRecordData: ["BYTE_SIZE = 192", "putInt(0, surfaceImplementation())",
                    "putLong(16, surfaceBinding())", "putFloat(48, currentRow0().x())",
                    "putFloat(96, previousRow0().x())", "putLong(144, emitterIndexAddress())",
                    "putInt(152, emitterPrimitiveBase())", "putInt(156, previousPositionStride())",
                    "putLong(160, previousPositionAddress())", "putLong(168, indexAddress())",
                    "putInt(176, firstIndex())"],
            RetainedLightRecordData: ["BYTE_SIZE = 80", "putInt(0, type())",
                    "putFloat(8, rangeMeters())", "putFloat(16, positionOrDirection().x())",
                    "putFloat(64, radiometry().x())"],
            NeeAtStateData: ["BYTE_SIZE = 104", "putLong(0, lightTableAddress())",
                    "putLong(32, pixelFeedbackAddress())", "putLong(40, proxyIndexAddress())",
                    "putInt(48, lightCount())", "putInt(72, tileSize())",
                    "putInt(80, candidateCount())", "putFloat(88, metersPerSceneUnit())",
                    "putInt(92, frameIndex())", "putFloat(96, powerTotal())",
                    "putFloat(100, localToGlobalRatio())"],
            PackedPathSegmentData: ["BYTE_SIZE = 48", "putFloat(0, ro().x())",
                    "putInt(12, rd())", "putInt(44, nextRecord())"]
    ]
    inputs.dir(generatedRecordRoot)
    inputs.dir(generatedBindingsRoot)
    doLast {
        expectedFragments.each { className, fragments ->
            def source = generatedRecordRoot.get().file(
                    "dev/comfyfluffy/caustica/renderer/raytracing/gen/${className}.java").asFile.getText("UTF-8")
            def missing = fragments.findAll { !source.contains(it) }
            if (!missing.empty) throw new GradleException("${className} ABI drifted: ${missing}")
        }
        def bindings = generatedBindingsRoot.get().file(
                "dev/comfyfluffy/caustica/renderer/raytracing/layout/RtBindings.java").asFile.getText("UTF-8")
        def requiredBindings = [
                "WORLD_PUSH_ADDRESS_OFFSET = 0", "WORLD_COMPOSITION_DATA_ADDRESS_OFFSET = 8",
                "WORLD_GEOMETRY_TABLE_ADDRESS_OFFSET = 16", "WORLD_PATH_QUEUE_ADDRESS_OFFSET = 24",
                "WORLD_TOP_LEVEL_AS_INDEX_OFFSET = 32", "WORLD_STABLE_PLANE_METADATA_IMAGE_INDEX_OFFSET = 40",
                "WORLD_SPECULAR_MOTION_GUIDE_INDEX_OFFSET = 64",
                "WORLD_DIFFUSE_RADIANCE_HIT_DISTANCE_INDEX_OFFSET = 68",
                "WORLD_SPECULAR_RADIANCE_HIT_DISTANCE_INDEX_OFFSET = 72",
                "WORLD_NRD_VIEW_Z_INDEX_OFFSET = 76",
                "WORLD_DENOISED_DIFFUSE_RADIANCE_HIT_DISTANCE_INDEX_OFFSET = 80",
                "WORLD_DENOISED_SPECULAR_RADIANCE_HIT_DISTANCE_INDEX_OFFSET = 84",
                "WORLD_NRD_STABLE_RADIANCE_INDEX_OFFSET = 88",
                "WORLD_INITIAL_VOLUME_IMPLEMENTATION_OFFSET = 92", "WORLD_INITIAL_VOLUME_ACTIVE_OFFSET = 96",
                "WORLD_INITIAL_VOLUME_BINDING_OFFSET = 104", "WORLD_INITIAL_VOLUME_INSTANCE_OFFSET = 112",
                "WORLD_NEE_AT_STATE_ADDRESS_OFFSET = 120", "WORLD_NRD_SIGNAL_ENCODING_OFFSET = 128"
        ]
        def missing = requiredBindings.findAll { !bindings.contains(it) }
        if (!missing.empty) throw new GradleException("world root ABI drifted: ${missing}")
        def obsolete = ["WORLD_SET", "WORLD_BINDLESS", "WORLD_PROVIDER_TEXTURES"].findAll {
            bindings.contains(it)
        }
        if (!obsolete.empty) throw new GradleException("world root retains descriptor-set ABI: ${obsolete}")
    }
}

def reproducibleRecordRoot = layout.buildDirectory.dir("generated/reproducibility/shaderRecords")
def reproduceRayTracingRecords = tasks.register("reproduceRayTracingRecords", GenerateShaderRecords) {
    dependsOn(prepareRayTracingReflectionSources)
    shaderRoot = reflectionRoot
    probeSource = reflectionRoot.map { it.file("layout/raytracing_probe.slang") }
    includeDirectories.from(configurations.slangShaderModules)
    recordSpecs = rayTracingRecordSpecs
    outDir = reproducibleRecordRoot
}
def reproducibleBindingsRoot = layout.buildDirectory.dir("generated/reproducibility/rtBindings")
def reproduceRayTracingBindings = tasks.register("reproduceRayTracingBindings", GenerateRtBindings) {
    dependsOn(prepareRayTracingReflectionSources)
    shaderRoot = reflectionRoot
    includeDirectories.from(configurations.slangShaderModules)
    javaPackage = "dev.comfyfluffy.caustica.renderer.raytracing.layout"
    outDir = reproducibleBindingsRoot
}
def verifyRayTracingGenerationReproducible = tasks.register("verifyRayTracingGenerationReproducible") {
    group = "verification"
    description = "Verifies repeat reflection produces byte-identical Java sources."
    dependsOn(generateRayTracingRecords, generateRayTracingBindings,
            reproduceRayTracingRecords, reproduceRayTracingBindings)
    doLast {
        def compareTrees = { File expectedRoot, File actualRoot ->
            def relativeFiles = { File root ->
                fileTree(root).files.collect { root.toPath().relativize(it.toPath()).toString().replace('\\', '/') }.sort()
            }
            def expectedFiles = relativeFiles(expectedRoot)
            def actualFiles = relativeFiles(actualRoot)
            if (expectedFiles != actualFiles) {
                throw new GradleException("generated file sets differ: ${expectedFiles} != ${actualFiles}")
            }
            expectedFiles.each { path ->
                if (!java.util.Arrays.equals(new File(expectedRoot, path).bytes, new File(actualRoot, path).bytes)) {
                    throw new GradleException("generated source is not reproducible: ${path}")
                }
            }
        }
        compareTrees(generatedRecordRoot.get().asFile, reproducibleRecordRoot.get().asFile)
        compareTrees(generatedBindingsRoot.get().asFile, reproducibleBindingsRoot.get().asFile)
    }
}

def verifyRayTracingSpirvTarget = tasks.register("verifyRayTracingSpirvTarget") {
    group = "verification"
    description = "Verifies reflection probes are validated as Vulkan 1.4 SPIR-V 1.6."
    dependsOn(generateRayTracingRecords, generateRayTracingBindings)
    doLast {
        [generateRayTracingRecords.get(), generateRayTracingBindings.get()].each { task ->
            if (task.spirvProfile.get() != "spirv_1_6" || task.vulkanTarget.get() != "vulkan1.4") {
                throw new GradleException("${task.name} targets ${task.spirvProfile.get()}/${task.vulkanTarget.get()}")
            }
        }
    }
}

def verifyRetainedLightShader = tasks.register("verifyRetainedLightShader") {
    group = "verification"
    description = "Verifies retained-light sampling and two-ray-type shadow tracing."
    def sampler = new File(worldShaderModules, "retained_lights.slang")
    def closestHit = new File(worldShaderModules, "closest_hit.slang")
    def worldMinimal = new File(worldShaderModules, "world_minimal.slang")
    def bake = new File(worldShaderModules, "nee_at_bake.slang")
    inputs.files(sampler, closestHit, worldMinimal, bake)
    doLast {
        def samplerSource = sampler.getText("UTF-8")
        def hitSource = closestHit.getText("UTF-8")
        def worldSource = worldMinimal.getText("UTF-8")
        def bakeSource = bake.getText("UTF-8")
        def required = [
                "RETAINED_LIGHT_PARALLELOGRAM", "RETAINED_LIGHT_SPOT", "RETAINED_LIGHT_DISTANT",
                "distance * state.metersPerSceneUnit > light.rangeMeters",
                "neeAtSampleGlobal", "neeAtSampleLocal", "neeAtLocalPdf",
                "radianceOverShapePdf", "neeAtWriteFeedback", "pixelFeedback[pixelIndex] = event",
                "(pixel + jitter) % (tileCount * tileSize)",
                "neeAtProposalPdf", "neeAtLocalCandidateCount(state, candidateCount)",
                "globalFraction * neeAtGlobalPdf", "NEE_AT_PROPOSAL_SCREEN_MIXTURE"
        ].findAll { !samplerSource.contains(it) }
        required += [
                "1u, 2u, 1u, ray, shadow", "evaluateBsdf(query)",
                "inout uint seed", "dot(input.geometricNormal, selected.direction)",
                "weightSum / (float(candidateCount) * selectedTarget)",
                "incomingFeedbackThroughput * estimator",
                "neeAtWriteFeedback(worldBindings, pixel, selected.lightIndex, feedback)",
                "emission * retainedEmissionMis(payload, record, input.position)",
                "payload.previousNeeProposalMode"
        ].findAll { !hitSource.contains(it) }
        required += [
                "state.localSlotCount", "state.tileSize * state.tileSize",
                "previousToCurrent", "InterlockedAdd(localMasses[slot], 1u)",
                "InterlockedAdd(counts[slot], 1u)", "+ paddedExtent - jitter) % paddedExtent",
                "GroupMemoryBarrierWithGroupSync", "uint2(localLights[slot], localScan[slot])",
                "blockSums[group] = blockScan[0]", "chunk += 64u", "blockScanNext[lane]",
                "distribution[state.lightCount] = uint2(0u, blockCarry)",
                "count = max(1u, uint(ceil(budget * pdf)))"
        ].findAll { !bakeSource.contains(it) }
        if (samplerSource.contains("InterlockedCompareExchange")) required += "no tracing-path CAS feedback"
        if (!worldSource.contains("records[worldInstanceCustomIndex() + GeometryIndex()]")) {
            required += "worldInstanceCustomIndex() + GeometryIndex()"
        }
        if (worldSource.contains("records[InstanceID() + GeometryIndex()]")) {
            required += "no InstanceID geometry-record addressing"
        }
        if (!worldSource.contains("HitTriangleVertexPosition(1u)")
                || !worldSource.contains("previousGeometricNormal = previousNormal * orientation")) {
            required += "position-fetch current/previous geometric normals"
        }
        if (!required.empty) throw new GradleException("retained light shader contract drifted: ${required}")
    }
}

def verifyRendererRayTracingDependencies = tasks.register("verifyRendererRayTracingDependencies") {
    group = "verification"
    description = "Verifies the ray-tracing shader compiler's physical package dependencies."
    doLast {
        def allowedProjects = [project.path, ":packages:engine", ":packages:engine-vulkan",
                               ":packages:slang-runtime", ":packages:vulkan-support", ":packages:api-support",
                               ":packages:shader-api", ":packages:features-builtin"] as Set
        def violations = []
        configurations.matching { it.canBeResolved }.each { configuration ->
            configuration.allDependencies.withType(ProjectDependency).each { dependency ->
                if (!allowedProjects.contains(dependency.path)) {
                    violations.add("${configuration.name}: ${dependency.path}")
                }
            }
        }
        if (!violations.empty) {
            throw new GradleException("renderer-raytracing dependency violations:\n${violations.join('\n')}")
        }
    }
}

def verifyRendererRayTracingImports = tasks.register("verifyRendererRayTracingImports") {
    group = "verification"
    description = "Verifies that renderer shader compilation has no Minecraft or root-mod imports."
    inputs.files(sourceSets.main.allJava)
    doLast {
        def forbidden = [
                "dev.comfyfluffy.caustica.minecraft.client.CausticaMod",
                "dev.comfyfluffy.caustica.config",
                "dev.comfyfluffy.caustica.minecraft",
                "dev.comfyfluffy.caustica.minecraft.client.platform",
                "dev.comfyfluffy.caustica.fabric",
                "dev.comfyfluffy.caustica.neoforge",
                "dev.comfyfluffy.caustica.ngx",
                "net.minecraft",
                "net.fabricmc",
                "net.neoforged"
        ]
        def violations = []
        sourceSets.main.allJava.files.sort().each { file ->
            file.eachLine { line, number ->
                def rootRayImport = line.contains("dev.comfyfluffy.caustica.renderer.runtime.")
                if (line.stripLeading().startsWith("import ")
                        && (forbidden.any { line.contains(it) } || rootRayImport)) {
                    violations.add("${file}:${number}: ${line.trim()}")
                }
            }
        }
        if (!violations.empty) {
            throw new GradleException("renderer-raytracing import violations:\n${violations.join('\n')}")
        }
    }
}

def verifyRendererRayTracingResources = tasks.register("verifyRendererRayTracingResources") {
    group = "verification"
    description = "Verifies that the package owns the complete world Slang resource set."
    def resourceRoot = file("src/main/resources")
    def legacyWorldRoot = rootProject.file("src/main/resources/caustica/shaders/world")
    inputs.dir(resourceRoot)
    inputs.files(fileTree(legacyWorldRoot))
    doLast {
        def actual = fileTree(new File(resourceRoot, "caustica/shaders/world")) {
            include "**/*"
        }.files.collect { it.name } as Set
        def foreign = fileTree(resourceRoot).files.findAll { file ->
            !file.toPath().toString().replace('\\', '/').contains("/caustica/shaders/world/")
        }
        def duplicateRootResources = fileTree(legacyWorldRoot).files
        if (actual != worldShaderNames || !foreign.empty || !duplicateRootResources.empty) {
            throw new GradleException("renderer-raytracing resource mismatch; missing="
                    + "${worldShaderNames - actual}, unexpected=${actual - worldShaderNames}, "
                    + "foreign=${foreign}, duplicateRootResources=${duplicateRootResources}")
        }
    }
}

def verifyRendererRayTracingJar = tasks.register("verifyRendererRayTracingJar") {
    group = "verification"
    dependsOn(tasks.named("jar"))
    doLast {
        def artifact = tasks.named("jar", Jar).get().archiveFile.get().asFile
        def names = []
        new java.util.jar.JarFile(artifact).withCloseable { jar ->
            def entries = jar.entries()
            while (entries.hasMoreElements()) names.add(entries.nextElement().name)
        }
        def rendererClassRoot = "dev/comfyfluffy/caustica/renderer/raytracing/"
        def generatedRecordClassRoot = "dev/comfyfluffy/caustica/renderer/raytracing/gen/"
        def generatedBindingsClass = "dev/comfyfluffy/caustica/renderer/raytracing/layout/RtBindings.class"
        def ownedResourceClasses = ["TraceExtent", "TraceImages", "TraceResources"].collect {
            rendererClassRoot + it + ".class"
        }
        def foreignClasses = names.findAll {
            it.endsWith(".class") && !it.startsWith(rendererClassRoot)
        }
        def generatedTopLevelClasses = names.findAll {
            it.startsWith(generatedRecordClassRoot) && it.endsWith("Data.class")
        } as Set
        def expectedGeneratedTopLevelClasses = ["WorldPushData", "RetainedGeometryRecordData",
                "RetainedLightRecordData", "NeeAtStateData", "PackedPathSegmentData",
                "StablePlaneRecordData"].collect {
            "${generatedRecordClassRoot}${it}.class"
        } as Set
        def packagedShaders = names.findAll {
            it.startsWith("caustica/shaders/world/") && it.endsWith(".slang")
        }.collect { it.substring("caustica/shaders/world/".length()) } as Set
        def expectedPipelineShaders = ["caustica/shaders/pipelines/nee_at/bake.comp.spv"] as Set
        def packagedPipelineShaders = names.findAll {
            it.startsWith("caustica/shaders/pipelines/") && it.endsWith(".spv")
        } as Set
        def foreignResources = names.findAll {
            it.startsWith("caustica/") && !it.endsWith("/")
                    && !it.startsWith("caustica/shaders/world/") && !expectedPipelineShaders.contains(it)
        }
        if (!foreignClasses.empty || generatedTopLevelClasses != expectedGeneratedTopLevelClasses
                || !names.contains(generatedBindingsClass) || !names.containsAll(ownedResourceClasses)
                || packagedShaders != worldShaderNames || packagedPipelineShaders != expectedPipelineShaders
                || !foreignResources.empty) {
            throw new GradleException("renderer-raytracing JAR mismatch; foreignClasses=${foreignClasses}, "
                    + "generatedClasses=${generatedTopLevelClasses}, ownedResources=${ownedResourceClasses - names}, "
                    + "missingShaders=${worldShaderNames - packagedShaders}, "
                    + "unexpectedShaders=${packagedShaders - worldShaderNames}, "
                    + "pipelineShaders=${packagedPipelineShaders}, foreignResources=${foreignResources}")
        }
    }
}

tasks.named("test", Test) {
    dependsOn(project(":packages:slang-runtime").tasks.named("bundleSlangRuntime"))
    useJUnitPlatform()
    jvmArgs "--enable-native-access=ALL-UNNAMED"
    systemProperty "caustica.test.spirvVal", rootProject.slangTooling.spirvVal.get()
}
tasks.named("check") {
    dependsOn(verifyRendererRayTracingDependencies, verifyRendererRayTracingImports,
            verifyRendererRayTracingResources, verifyRendererRayTracingJar, verifyRayTracingAbi,
            verifyRayTracingGenerationReproducible, verifyRayTracingSpirvTarget,
            verifyRetainedLightShader)
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named("jar", Jar).configure {
    from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER", "THIRD_PARTY_NOTICES.md")) {
        into "META-INF"
    }
}

tasks.named("sourcesJar", Jar).configure {
    from("shaders") { into "shaders" }
    from("src/shaderReflection") { into "shaderReflection" }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "caustica-renderer-raytracing"
            from components.java
        }
    }
}
