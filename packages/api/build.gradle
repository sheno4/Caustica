plugins {
    id "java-library"
    id "maven-publish"
}

version = project.api_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

base {
    archivesName = "caustica-api"
}

repositories {
    mavenCentral()
}

dependencies {
    api project(":packages:shader-api")
    api project(":packages:settings-api")
    api "org.joml:joml:${project.joml_version}"
    api "org.lwjgl:lwjgl:${project.lwjgl_version}"
    api "org.lwjgl:lwjgl-vulkan:${project.lwjgl_version}"
    // GpuDevice.vmaAllocator() hands out a VmaAllocator and the API has no buffer or image
    // factories, so allocating is something every extension does through VMA directly.
    api "org.lwjgl:lwjgl-vma:${project.lwjgl_version}"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named("jar", Jar).configure {
    from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER")) {
        into "META-INF"
    }
}

def verifyApiJar = tasks.register("verifyApiJar") {
    group = "verification"
    description = "Verifies that the Java API artifact contains only public Caustica classes."
    dependsOn(tasks.named("jar"))
    inputs.file(tasks.named("jar", Jar).flatMap { it.archiveFile })
    doLast {
        def jarPath = tasks.named("jar", Jar).get().archiveFile.get().asFile
        def entries = []
        new java.util.jar.JarFile(jarPath).withCloseable { jar ->
            def enumeration = jar.entries()
            while (enumeration.hasMoreElements()) {
                entries.add(enumeration.nextElement().name)
            }
        }
        def implementationClasses = entries.findAll { entry ->
            entry.endsWith(".class")
                    && entry.startsWith("dev/comfyfluffy/caustica/")
                    && !entry.startsWith("dev/comfyfluffy/caustica/api/")
        }
        if (!implementationClasses.empty) {
            throw new GradleException("caustica-api contains implementation classes: ${implementationClasses}")
        }
        def shaderModules = entries.findAll { entry -> entry.startsWith("caustica/shaders/api/") && !entry.endsWith("/") }
        if (!shaderModules.empty) {
            throw new GradleException("caustica-api duplicates shader-api resources: ${shaderModules}")
        }
    }
}

tasks.named("check") {
    dependsOn(verifyApiJar)
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "caustica-api"
            from components.java
        }
    }
}
