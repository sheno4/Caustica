import dev.comfyfluffy.caustica.slangtooling.CompileSlangShaders

plugins {
	id "dev.comfyfluffy.caustica.slang-tooling"
	id "maven-publish"
}

def embeddedPackages = [
	"api",
	"api-support",
	"config",
	"engine",
	"engine-vulkan",
	"features-builtin",
	"minecraft-api",
	"minecraft-adapter",
	"minecraft-content",
	"minecraft-rendering",
	"nvidia-ngx",
	"nvidia-nrd",
	"renderer-denoising",
	"renderer-presentation",
	"renderer-raytracing",
	"renderer-runtime",
	"settings-api",
	"shader-api",
	"slang-runtime",
	"vulkan-support",
].collect { project(":packages:${it}") }
embeddedPackages.each { evaluationDependsOn(it.path) }
def embeddedJavaPackages = embeddedPackages.findAll { it.name != "shader-api" }

def loader = (findProperty("loader") ?: "fabric").toString().toLowerCase(Locale.ROOT)
if (!(loader in ["fabric", "neoforge"])) {
	throw new GradleException("Unknown loader '${loader}'. Expected 'fabric' or 'neoforge'.")
}
apply plugin: loader == "fabric" ? "fabric-loom" : "net.neoforged.moddev"

version = project.mod_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def buildRoot = providers.gradleProperty("buildRoot").orElse("build").get()
layout.buildDirectory = rootProject.layout.projectDirectory.dir(buildRoot)

base {
	archivesName = project.archives_base_name
}

// Obfuscation is disabled for this development build, so `jar` is the loader-specific shippable artifact.
tasks.named("jar") {
	archiveClassifier = loader
}

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = "NeoForge"
		url = "https://maven.neoforged.net/releases"
	}
	mavenCentral()
}

sourceSets.main.java.srcDir("src/${loader}/java")
sourceSets.main.resources.srcDir("src/${loader}/resources")
if (loader == "neoforge") {
	// Fixtures must load with the tested mod because their settings interfaces live in that module.
	sourceSets.test.java.srcDirs(project(":packages:settings-api").sourceSets.testFixtures.java.srcDirs)
}

// The renderer only attaches to the Vulkan backend, so every dev client run needs these.
def CLIENT_PROGRAM_ARGUMENTS = ["--renderDebugLabels", "--graphicsBackend", "VULKAN"]
def quickPlayWorld = findProperty("quickPlayWorld")?.toString()
if (quickPlayWorld) {
	CLIENT_PROGRAM_ARGUMENTS.addAll("--quickPlaySingleplayer", quickPlayWorld)
}

// Heap and GC tuning for dev client runs only. These belong on the run configuration rather than
// JAVA_TOOL_OPTIONS, which every forked JVM inherits — including NeoForge's JDK 21 tooling JVM, which
// rejects newer flags and fails the run before the game starts.
def CLIENT_JVM_ARGUMENTS = ["-Xmx8G", "-XX:+UseStringDeduplication", "-XX:+UseZGC"]
if (findProperty("debugAgent")?.toString()?.toBoolean()) {
	CLIENT_JVM_ARGUMENTS.add("-Dcaustica.debug.enabled=true")
}

if (loader == "fabric") {
	loom {
		runs {
			client {
				client()
				setConfigName("Fabric Client")
				ideConfigGenerated = true
				runDir = rootProject.file("run")
				vmArg "--enable-native-access=ALL-UNNAMED"
				vmArg "-Xss16m"
				CLIENT_JVM_ARGUMENTS.each { vmArg it }
				programArgs CLIENT_PROGRAM_ARGUMENTS
				if (file("/run/opengl-driver/lib").exists()) {
					def inherited = System.getenv("LD_LIBRARY_PATH")
					environmentVariable "LD_LIBRARY_PATH",
							inherited ? "/run/opengl-driver/lib:${inherited}" : "/run/opengl-driver/lib"
				}
			}
			server {
				server()
				setConfigName("Fabric Server")
				ideConfigGenerated = true
				runDir = rootProject.file("run")
			}
		}
	}
} else {
	neoForge {
		version = project.neoforge_version
		runs {
			client {
				client()
				gameDirectory = rootProject.file("run")
				jvmArgument "--enable-native-access=ALL-UNNAMED"
				jvmArgument "-Xss16m"
				CLIENT_JVM_ARGUMENTS.each { jvmArgument it }
				// devlaunch reads the main class from the first program argument, so Gradle's --args
				// cannot carry these; the run configuration owns them for both loaders instead.
				programArguments.addAll(CLIENT_PROGRAM_ARGUMENTS)
			}
			server {
				server()
				gameDirectory = rootProject.file("run")
			}
		}
		mods {
			caustica {
				sourceSet(sourceSets.main)
				embeddedPackages.each { sourceSet(it.sourceSets.main) }
			}
		}
		unitTest {
			enable()
			testedMod = mods.caustica
		}
	}
}

configurations {
	apiRuntime
	slangShaderModules {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
}
sourceSets.main.runtimeClasspath += configurations.apiRuntime

dependencies {
	if (loader == "fabric") {
		testImplementation testFixtures(project(":packages:settings-api"))
	}
	embeddedJavaPackages.each { dependency ->
		compileOnly dependency
		testImplementation dependency
		if (dependency.name != "nvidia-nrd") apiRuntime dependency
	}
	apiRuntime project(path: ":packages:nvidia-nrd", configuration: "nrdNatives")
	slangShaderModules project(path: ":packages:shader-api", configuration: "runtimeElements")
	slangShaderModules project(path: ":packages:features-builtin", configuration: "runtimeElements")
	slangShaderModules project(path: ":packages:renderer-raytracing", configuration: "runtimeElements")
	slangShaderModules project(path: ":packages:minecraft-rendering", configuration: "runtimeElements")
	if (loader == "fabric") {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Layered TOML config (config/caustica.toml) — NightConfig, the same library NeoForge's
	// ModConfigSpec is built on.
	def nightConfigCore = implementation("com.electronwill.night-config:core:3.8.3")
	def nightConfigToml = implementation("com.electronwill.night-config:toml:3.8.3")
	if (loader == "fabric") {
		include nightConfigCore
		include nightConfigToml
	}

}

processResources {
	doFirst {
		delete(destinationDir)
	}
	inputs.property "version", project.version
	inputs.property "neoforge_version", project.neoforge_version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version,
				"neoforge_version": inputs.properties.neoforge_version
	}
}

// Compile Slang sources to SPIR-V at build time instead of tracking binaries. Requires slangc and
// spirv-val from the Vulkan SDK or PATH.
def shaderGenRoot = layout.buildDirectory.dir("generated/shaders") // classpath root -> /caustica/shaders/*.spv
def runtimeMinecraftSourceDir = file("src/main/resources/caustica/shaders/minecraft")

def compileShaders = tasks.register("compileShaders", CompileSlangShaders) {
	group = "build"
	description = "Compiles shaders/** shader sources to SPIR-V and validates them."
	sourceDirectory = file("shaders")
	includeDirectories.from(runtimeMinecraftSourceDir, configurations.slangShaderModules)
	moduleAliases = [
			"radiance_any_hit_rahit.slang":
					"caustica/shaders/world/radiance_any_hit.rahit.slang",
			"shadow_any_hit_rahit.slang":
					"caustica/shaders/world/shadow_any_hit.rahit.slang"
	]
	descriptorHeapNative = true
	mappedDescriptorBindingSources = [
			"pipelines/block_outline/fragment.frag.slang"
	]
	outputDirectory = layout.buildDirectory.dir("generated/shaders/caustica/shaders")
}

def verifyRtBindingsGeneration = tasks.register("verifyRtBindingsGeneration") {
	group = "verification"
	description = "Verifies the renderer package's generated world root layout."
	dependsOn(project(":packages:renderer-raytracing").tasks.named("verifyRayTracingAbi"))
}

// Emit the .spv into the main resources so they land in the jar / on the runClient classpath at the
// same /caustica/shaders/ path the pipeline loaders read. builtBy wires the dependency.
sourceSets.main.resources.srcDir(files(shaderGenRoot).builtBy(compileShaders))

def slangRuntimePackage = project(":packages:slang-runtime")
def bundleSlangRuntime = slangRuntimePackage.tasks.named("bundleSlangRuntime")
def nvidiaNrdPackage = project(":packages:nvidia-nrd")
def nrdNativeJar = nvidiaNrdPackage.tasks.named("nrdNativeJar", Jar)

tasks.named("test", Test) {
	useJUnitPlatform()
	workingDir(rootProject.projectDir)
	dependsOn(bundleSlangRuntime)
	jvmArgs "--enable-native-access=ALL-UNNAMED"
	doFirst {
		def os = org.gradle.internal.os.OperatingSystem.current()
		def arch = System.getProperty("os.arch", "").toLowerCase(java.util.Locale.ROOT)
		def x64 = arch == "x86_64" || arch == "amd64"
		def platform = os.windows && x64 ? "windows-x64" : os.linux && x64 ? "linux-x64" : null
		if (platform == null) throw new GradleException("Unsupported Slang runtime host")
		def runtimeDir = slangRuntimePackage.layout.buildDirectory.dir(
				"generated/slang-runtime/caustica/natives/slang/${project.slang_runtime_version}/${platform}")
				.get().asFile
		systemProperty "caustica.slang.path", runtimeDir.absolutePath
	}
}
tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

tasks.named("jar", Jar).configure {
	dependsOn(nrdNativeJar)
	embeddedPackages.each { from(it.sourceSets.main.output) }
	from(nrdNativeJar.flatMap { it.archiveFile }.map { zipTree(it) }) {
		include "caustica/natives/nrd/**"
	}
	from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER", "THIRD_PARTY_NOTICES.md")) {
		into "META-INF"
	}
}

tasks.named("sourcesJar", Jar).configure {
	embeddedPackages.each { dependency ->
		from(dependency.name == "slang-runtime"
				? dependency.sourceSets.main.allJava : dependency.sourceSets.main.allSource)
	}
	from(project(":packages:features-builtin").file("shaders")) { into "shaders" }
	from(project(":packages:minecraft-rendering").file("src/shaderReflection")) { into "shaders/minecraft-rendering" }
	from(project(":packages:nvidia-ngx").file("native")) { into "native/nvidia-ngx" }
	from(project(":packages:nvidia-nrd").file("native")) { into "native/nvidia-nrd" }
	from(project(":packages:renderer-presentation").file("shaders")) { into "shaders/presentation" }
	from(project(":packages:slang-runtime").file("native")) { into "native/slang-runtime" }
}

def verifyEmbeddedApi = tasks.register("verifyEmbeddedApi") {
	group = "verification"
	description = "Verifies that the full mod embeds the Java and Slang API artifacts exactly once."
	dependsOn(tasks.named("jar"), project(":packages:api").tasks.named("jar"),
			project(":packages:api-support").tasks.named("jar"),
			project(":packages:config").tasks.named("jar"),
			project(":packages:engine").tasks.named("jar"),
			project(":packages:engine-vulkan").tasks.named("jar"),
			project(":packages:features-builtin").tasks.named("jar"),
			project(":packages:minecraft-api").tasks.named("jar"),
			project(":packages:minecraft-adapter").tasks.named("jar"),
			project(":packages:minecraft-content").tasks.named("jar"),
			project(":packages:minecraft-rendering").tasks.named("jar"),
			project(":packages:nvidia-ngx").tasks.named("jar"),
			project(":packages:nvidia-nrd").tasks.named("jar"), nrdNativeJar,
			project(":packages:renderer-denoising").tasks.named("jar"),
			project(":packages:renderer-presentation").tasks.named("jar"),
			project(":packages:renderer-raytracing").tasks.named("jar"),
			project(":packages:renderer-runtime").tasks.named("jar"),
			project(":packages:settings-api").tasks.named("jar"),
			project(":packages:shader-api").tasks.named("jar"),
			project(":packages:slang-runtime").tasks.named("jar"),
			project(":packages:vulkan-support").tasks.named("jar"))
	inputs.file(tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:api").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:api-support").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:config").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:engine").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:engine-vulkan").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:features-builtin").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:minecraft-api").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:minecraft-adapter").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:minecraft-content").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:minecraft-rendering").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:nvidia-ngx").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:nvidia-nrd").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(nrdNativeJar.flatMap { it.archiveFile })
	inputs.file(project(":packages:renderer-denoising").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:renderer-presentation").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:renderer-raytracing").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:renderer-runtime").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:settings-api").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:shader-api").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:slang-runtime").tasks.named("jar", Jar).flatMap { it.archiveFile })
	inputs.file(project(":packages:vulkan-support").tasks.named("jar", Jar).flatMap { it.archiveFile })
	doLast {
		def names = { File artifact ->
			def result = []
			new java.util.jar.JarFile(artifact).withCloseable { jar ->
				def enumeration = jar.entries()
				while (enumeration.hasMoreElements()) {
					result.add(enumeration.nextElement().name)
				}
			}
			return result
		}
		def rootEntries = names(tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def apiEntries = names(project(":packages:api").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def supportEntries = names(project(":packages:api-support").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def configEntries = names(project(":packages:config").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def engineEntries = names(project(":packages:engine").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def engineVulkanEntries = names(project(":packages:engine-vulkan").tasks.named("jar", Jar)
				.get().archiveFile.get().asFile)
		def builtinEntries = names(project(":packages:features-builtin").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def minecraftApiEntries = names(project(":packages:minecraft-api").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def minecraftAdapterEntries = names(project(":packages:minecraft-adapter").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def minecraftContentEntries = names(project(":packages:minecraft-content").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def minecraftRenderingEntries = names(project(":packages:minecraft-rendering").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def nvidiaNgxEntries = names(project(":packages:nvidia-ngx").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def nvidiaNrdEntries = names(project(":packages:nvidia-nrd").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def nrdNativeEntries = names(nrdNativeJar.get().archiveFile.get().asFile)
		def rendererDenoisingEntries = names(project(":packages:renderer-denoising").tasks.named("jar", Jar)
				.get().archiveFile.get().asFile)
		def rendererPresentationEntries = names(project(":packages:renderer-presentation").tasks.named("jar", Jar)
				.get().archiveFile.get().asFile)
		def rendererRayTracingEntries = names(project(":packages:renderer-raytracing").tasks.named("jar", Jar)
				.get().archiveFile.get().asFile)
		def rendererRuntimeEntries = names(project(":packages:renderer-runtime").tasks.named("jar", Jar)
				.get().archiveFile.get().asFile)
		def settingsApiEntries = names(project(":packages:settings-api").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def shaderApiEntries = names(project(":packages:shader-api").tasks.named("jar", Jar).get().archiveFile.get().asFile)
		def slangRuntimeEntries = names(project(":packages:slang-runtime").tasks.named("jar", Jar)
				.get().archiveFile.get().asFile)
		def vulkanSupportEntries = names(project(":packages:vulkan-support").tasks.named("jar", Jar)
				.get().archiveFile.get().asFile)
		def required = apiEntries.findAll { it.endsWith(".class") }
		required.addAll(supportEntries.findAll { it.endsWith(".class") })
		required.addAll(configEntries.findAll { it.endsWith(".class") })
		required.addAll(engineEntries.findAll { it.endsWith(".class") })
		required.addAll(engineVulkanEntries.findAll { it.endsWith(".class") })
		required.addAll(builtinEntries.findAll { it.endsWith(".class")
				|| it.startsWith("caustica/shaders/builtin/") || it.startsWith("caustica/shaders/pipelines/bloom/") })
		required.addAll(minecraftApiEntries.findAll { it.endsWith(".class") })
		required.addAll(minecraftAdapterEntries.findAll { it.endsWith(".class") })
		required.addAll(minecraftContentEntries.findAll { it.endsWith(".class") })
		required.addAll(minecraftRenderingEntries.findAll { it.endsWith(".class")
				|| it.startsWith("caustica/shaders/minecraft/") && !it.endsWith("/") })
		required.addAll(nvidiaNgxEntries.findAll { it.endsWith(".class")
				|| it.startsWith("caustica/natives/") && !it.endsWith("/") })
		required.addAll(nvidiaNrdEntries.findAll { it.endsWith(".class") })
		required.addAll(nrdNativeEntries.findAll {
			it.startsWith("caustica/natives/nrd/") && !it.endsWith("/")
		})
		required.addAll(rendererDenoisingEntries.findAll { it.endsWith(".class") })
		required.addAll(rendererPresentationEntries.findAll { it.endsWith(".class")
				|| it.startsWith("caustica/shaders/pipelines/") && !it.endsWith("/")
				|| it.startsWith("caustica/color/") && !it.endsWith("/") })
		required.addAll(rendererRayTracingEntries.findAll { it.endsWith(".class")
				|| it.startsWith("caustica/shaders/world/") && !it.endsWith("/")
				|| it.startsWith("caustica/shaders/pipelines/nee_at/") && !it.endsWith("/") })
		required.addAll(rendererRuntimeEntries.findAll { it.endsWith(".class") })
		required.addAll(settingsApiEntries.findAll { it.endsWith(".class") })
		required.addAll(shaderApiEntries.findAll { entry ->
			entry.startsWith("caustica/shaders/api/") && !entry.endsWith("/")
		})
		required.addAll(slangRuntimeEntries.findAll { it.endsWith(".class")
				|| it.startsWith("caustica/natives/slang/") && !it.endsWith("/") })
		required.addAll(vulkanSupportEntries.findAll { it.endsWith(".class") })
		def missing = required.findAll { !rootEntries.contains(it) }
		def duplicated = required.findAll { requiredEntry ->
			rootEntries.count { it == requiredEntry } != 1
		}
		if (!missing.empty || !duplicated.empty) {
			throw new GradleException("embedded API mismatch; missing=${missing}, duplicate=${duplicated}")
		}
	}
}

def verifyMinecraftClientOwnership = tasks.register("verifyMinecraftClientOwnership") {
	group = "verification"
	description = "Verifies that Minecraft host sources and shaders are owned by this package."
	doLast {
		def legacyRoots = [rootProject.file("src"), rootProject.file("shaders")]
		def legacy = legacyRoots.findAll { it.exists() }
		if (!legacy.empty) {
			throw new GradleException("root Minecraft host ownership remains: ${legacy}")
		}
	}
}

tasks.named("check") {
	dependsOn(verifyEmbeddedApi, verifyMinecraftClientOwnership)
}

tasks.register("examplesCheck") {
	group = "verification"
	description = "Checks the public API showcase and both physical glTF example packages."
	dependsOn(project(":packages:examples:api-showcase").tasks.named("check"),
			project(":packages:examples:gltf-content").tasks.named("check"),
			project(":packages:examples:gltf-viewer-minecraft").tasks.named("check"))
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
