plugins {
    id "java-library"
    id "maven-publish"
    id "dev.comfyfluffy.caustica.slang-tooling"
}

version = project.api_version
group = project.maven_group

base {
    archivesName = "caustica-shader-api"
}

def publicModules = [
        "caustica_api.slang",
        "caustica_color.slang",
        "caustica_coverage.slang",
        "caustica_environment.slang",
        "caustica_resources.slang",
        "caustica_surface.slang",
        "caustica_types.slang",
        "caustica_volume.slang"
]

tasks.named("jar", Jar).configure {
    from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER")) {
        into "META-INF"
    }
}

def verifyShaderApiJar = tasks.register("verifyShaderApiJar") {
    group = "verification"
    description = "Verifies the published public Slang ABI module set."
    dependsOn(tasks.named("jar"))
    inputs.file(tasks.named("jar", Jar).flatMap { it.archiveFile })
    doLast {
        def jarPath = tasks.named("jar", Jar).get().archiveFile.get().asFile
        def entries = []
        new java.util.jar.JarFile(jarPath).withCloseable { jar ->
            def enumeration = jar.entries()
            while (enumeration.hasMoreElements()) entries.add(enumeration.nextElement().name)
        }
        def expected = publicModules.collect { "caustica/shaders/api/${it}".toString() }
        def actual = entries.findAll { it.startsWith("caustica/shaders/api/") && !it.endsWith("/") }
        if (actual.sort() != expected.sort()) {
            throw new GradleException("public Slang ABI module set differs; expected=${expected.sort()}, actual=${actual.sort()}")
        }
        def classes = entries.findAll { it.endsWith(".class") }
        if (!classes.empty) {
            throw new GradleException("caustica-shader-api contains Java classes: ${classes}")
        }
    }
}

tasks.named("check") {
    dependsOn(verifyShaderApiJar, tasks.named("validateShaderApiTooling"),
            tasks.named("reflectShaderApiTooling"))
}

def validateShaderApiTooling = tasks.register("validateShaderApiTooling",
        dev.comfyfluffy.caustica.slangtooling.CompileSlangShaders) {
    group = "verification"
    description = "Compiles a miniature consumer of the public Slang ABI through the reusable tooling plugin."
    sourceDirectory = file("src/toolingTest/slang")
    includeDirectories.from(file("src/main/resources/caustica/shaders/api"))
    aliasSourceDirectory = file("src/main/resources/caustica/shaders/api")
    descriptorHeapNative = true
    outputDirectory = layout.buildDirectory.dir("tooling-test")
}

def reflectShaderApiTooling = tasks.register("reflectShaderApiTooling",
        dev.comfyfluffy.caustica.slangtooling.ReflectSlang) {
    group = "verification"
    description = "Reflects a miniature consumer through the reusable Slang tooling plugin."
    sourceFile = file("src/toolingTest/slang/public_api.comp.slang")
    includeDirectories.from(file("src/main/resources/caustica/shaders/api"))
    descriptorHeapNative = true
    reflectionJson = layout.buildDirectory.file("tooling-test/public-api-reflection.json")
    spirv = layout.buildDirectory.file("tooling-test/public-api-reflection.spv")
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "caustica-shader-api"
            from components.java
        }
    }
}
