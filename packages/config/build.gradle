plugins {
    id "java-library"
    id "maven-publish"
}

version = project.api_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

base { archivesName = "caustica-config" }
repositories { mavenCentral() }

dependencies {
    api project(":packages:settings-api")
    api "com.electronwill.night-config:core:3.8.3"
    implementation "com.electronwill.night-config:toml:3.8.3"
    implementation "org.slf4j:slf4j-api:2.0.17"
    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def verifyConfigJar = tasks.register("verifyConfigJar") {
    group = "verification"
    description = "Verifies that the config artifact contains only dev.comfyfluffy.caustica.config classes."
    dependsOn(tasks.named("jar"))
    inputs.file(tasks.named("jar", Jar).flatMap { it.archiveFile })
    doLast {
        def jarPath = tasks.named("jar", Jar).get().archiveFile.get().asFile
        def strays = []
        new java.util.jar.JarFile(jarPath).withCloseable { jar ->
            jar.entries().each { entry ->
                if (entry.name.endsWith(".class")
                        && !entry.name.startsWith("dev/comfyfluffy/caustica/config/")) {
                    strays.add(entry.name)
                }
            }
        }
        if (!strays.empty) {
            throw new GradleException("caustica-config contains classes outside its package: ${strays}")
        }
    }
}

tasks.named("test", Test) { useJUnitPlatform() }
tasks.named("check") { dependsOn(verifyConfigJar) }
tasks.withType(JavaCompile).configureEach { options.release = 25 }

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named("jar", Jar).configure {
    from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER")) { into "META-INF" }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "caustica-config"
            from components.java
        }
    }
}
