plugins {
    id "java-library"
    id "maven-publish"
}

version = project.api_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

base { archivesName = "caustica-minecraft-api" }
repositories { mavenCentral() }

dependencies {
    api project(":packages:api")
    api project(":packages:settings-api")
    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test", Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named("jar", Jar).configure {
    from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER")) { into "META-INF" }
}

def verifyMinecraftApiJar = tasks.register("verifyMinecraftApiJar") {
    group = "verification"
    dependsOn(tasks.named("jar"))
    doLast {
        def jarPath = tasks.named("jar", Jar).get().archiveFile.get().asFile
        def strays = []
        new java.util.jar.JarFile(jarPath).withCloseable { jar ->
            def entries = jar.entries()
            while (entries.hasMoreElements()) {
                def name = entries.nextElement().name
                if (name.endsWith(".class")
                        && name.startsWith("dev/comfyfluffy/caustica/")
                        && !name.startsWith("dev/comfyfluffy/caustica/minecraft/api/")) {
                    strays.add(name)
                }
            }
        }
        if (!strays.empty) {
            throw new GradleException("caustica-minecraft-api contains non-API classes: ${strays}")
        }
    }
}

tasks.named("check") { dependsOn(verifyMinecraftApiJar) }

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "caustica-minecraft-api"
            from components.java
        }
    }
}
