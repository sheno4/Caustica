import dev.comfyfluffy.caustica.slangtooling.CompileSlangShaders

plugins {
    id "java-library"
    id "dev.comfyfluffy.caustica.slang-tooling"
}

version = rootProject.version
group = rootProject.group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

base {
    archivesName = "caustica-gltf-content"
}

repositories {
    mavenCentral()
}

configurations {
    slangShaderModules {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    api project(":packages:api")
    implementation project(":packages:vulkan-support")
    implementation "com.google.code.gson:gson:2.14.0"
    slangShaderModules project(path: ":packages:shader-api", configuration: "runtimeElements")

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def validateContentShaders = tasks.register("validateContentShaders", CompileSlangShaders) {
    sourceDirectory = layout.projectDirectory.dir("src/shaderValidation")
    includeDirectories.from(layout.projectDirectory.dir("src/main/resources"),
            configurations.slangShaderModules)
    aliasSourceDirectory = layout.projectDirectory.dir("src/shaderValidation")
    sourcePatterns = ["**/*.comp.slang"]
    outputDirectory = layout.buildDirectory.dir("validated-shaders")
}

def checkContentBoundary = tasks.register("checkContentBoundary") {
    group = "verification"
    description = "Rejects Minecraft and renderer implementation dependencies from reusable glTF content."
    def allowedProjects = [project.path, ":packages:api", ":packages:shader-api",
                           ":packages:vulkan-support"] as Set
    def checkedConfigurations = configurations.matching { it.canBeResolved }
    doLast {
        def violations = []
        checkedConfigurations.each { configuration ->
            configuration.allDependencies.withType(ProjectDependency).each { dependency ->
                if (!allowedProjects.contains(dependency.path)) {
                    violations.add("${configuration.name}: project dependency ${dependency.path}")
                }
            }
        }
        if (!violations.empty) {
            throw new GradleException("Reusable glTF content crossed its API boundary:\n"
                    + violations.join("\n"))
        }
    }
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

tasks.named("check") {
    dependsOn(checkContentBoundary, validateContentShaders)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named("jar", Jar).configure {
    from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER", "THIRD_PARTY_NOTICES.md")) {
        into "META-INF"
    }
}
