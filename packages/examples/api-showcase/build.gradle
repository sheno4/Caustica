import dev.comfyfluffy.caustica.slangtooling.CompileSlangShaders
import dev.comfyfluffy.caustica.slangtooling.GenerateShaderRecords

plugins {
    id "java-library"
    id "dev.comfyfluffy.caustica.slang-tooling"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def osArch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
def lwjglTestNatives = null
if (osName.contains("windows")) {
    lwjglTestNatives = osArch.contains("aarch64") ? "natives-windows-arm64" : "natives-windows"
} else if (osName.contains("mac")) {
    lwjglTestNatives = osArch.contains("aarch64") ? "natives-macos-arm64" : "natives-macos"
} else if (osName.contains("linux")) {
    lwjglTestNatives = osArch.contains("aarch64") ? "natives-linux-arm64"
            : osArch.startsWith("arm") ? "natives-linux-arm32" : "natives-linux"
}

configurations {
    slangShaderModules {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    testImplementation testFixtures(project(":packages:settings-api"))
    compileOnly project(":packages:api")
    compileOnly project(":packages:minecraft-api")
    compileOnly project(":packages:vulkan-support")
    testImplementation project(":packages:api")
    testImplementation project(":packages:minecraft-api")
    testImplementation project(":packages:vulkan-support")
    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    if (lwjglTestNatives != null) {
        testRuntimeOnly "org.lwjgl:lwjgl:${project.lwjgl_version}:${lwjglTestNatives}"
    }
    slangShaderModules project(path: ":packages:shader-api", configuration: "runtimeElements")
}

def generatedShaderResources = layout.buildDirectory.dir("generated/resources")
def validateShowcaseShaders = tasks.register("validateShowcaseShaders", CompileSlangShaders) {
    group = "verification"
    description = "Compiles the showcase world models and pass entry points against the public Slang ABI."
    sourceDirectory = layout.projectDirectory.dir("src/main/resources/api_showcase/shaders")
    includeDirectories.from(
            layout.projectDirectory.dir("src/main/resources/api_showcase/shaders"),
            configurations.slangShaderModules)
    aliasSourceDirectory = layout.projectDirectory.dir("src/main/resources/api_showcase/shaders")
    descriptorHeapNative = true
    mappedDescriptorBindingSources = ["passes/ui_marker.frag.slang"]
    outputDirectory = generatedShaderResources.map { it.dir("api_showcase/shaders") }
}
sourceSets.main.resources.srcDir(files(generatedShaderResources).builtBy(validateShowcaseShaders))

def reflectionRoot = layout.buildDirectory.dir("generated/reflection-sources")
def prepareShowcaseReflectionSources = tasks.register("prepareShowcaseReflectionSources", Sync) {
    from(layout.projectDirectory.dir("src/main/resources/api_showcase/shaders"))
    from(layout.projectDirectory.dir("src/shaderReflection")) { into "layout" }
    into(reflectionRoot)
}

def generatedRecordRoot = layout.buildDirectory.dir("generated/sources/shaderRecords")
def generateShowcaseRecords = tasks.register("generateShowcaseRecords", GenerateShaderRecords) {
    group = "build"
    description = "Generates reusable showcase push-data records from Slang reflection."
    dependsOn(prepareShowcaseReflectionSources)
    shaderRoot = reflectionRoot
    probeSource = reflectionRoot.map { it.file("layout/showcase_probe.slang") }
    includeDirectories.from(configurations.slangShaderModules)
    recordSpecs = [
            "push|postPushProbe|ShowcasePostPush|dev.comfyfluffy.caustica.example.showcase.gen|ShowcasePostPushData|false",
            "push|uiPushProbe|ShowcaseUiPush|dev.comfyfluffy.caustica.example.showcase.gen|ShowcaseUiPushData|false"
    ]
    outDir = generatedRecordRoot
}

sourceSets.main.java.srcDir(files(generatedRecordRoot).builtBy(generateShowcaseRecords))

tasks.named("test", Test) {
    useJUnitPlatform()
}

tasks.named("check") {
    dependsOn(validateShowcaseShaders, generateShowcaseRecords)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
