plugins {
    id "fabric-loom" version "${loom_version}" apply false
    id "net.neoforged.moddev" version "${neogradle_version}" apply false
}

def loader = (findProperty("loader") ?: "fabric").toString().toLowerCase(Locale.ROOT)
if (!(loader in ["fabric", "neoforge"])) {
    throw new GradleException("Unknown loader '${loader}'. Expected 'fabric' or 'neoforge'.")
}
apply plugin: loader == "fabric" ? "fabric-loom" : "net.neoforged.moddev"

version = rootProject.version
group = rootProject.group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

base {
    archivesName = "caustica-gltf-viewer"
}

tasks.named("jar") {
    archiveClassifier = loader
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "NeoForge"
        url = "https://maven.neoforged.net/releases"
    }
    mavenCentral()
}

sourceSets.main.java.srcDir("src/${loader}/java")
sourceSets.main.resources.srcDir("src/${loader}/resources")
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

def clientProgramArguments = ["--renderDebugLabels", "--graphicsBackend", "VULKAN"]
def quickPlayWorld = findProperty("quickPlayWorld")?.toString()
if (quickPlayWorld) {
    clientProgramArguments.addAll("--quickPlaySingleplayer", quickPlayWorld)
}

if (loader == "fabric") {
    loom {
        runs {
            client {
                client()
                setConfigName("glTF Viewer Extension Client")
                runDir = rootProject.file("run")
                vmArg "--enable-native-access=ALL-UNNAMED"
                vmArg "-Xss16m"
                vmArg "-Xmx8G"
                vmArg "-XX:+UseZGC"
                programArgs clientProgramArguments
            }
        }
    }
} else {
    neoForge {
        version = project.neoforge_version
        runs {
            client {
                client()
                gameDirectory = rootProject.file("run")
                jvmArgument "--enable-native-access=ALL-UNNAMED"
                jvmArgument "-Xss16m"
                jvmArgument "-Xmx8G"
                jvmArgument "-XX:+UseZGC"
                programArguments.addAll(clientProgramArguments)
            }
        }
        mods {
            caustica {
                sourceSet(rootProject.sourceSets.main)
                sourceSet(project(":packages:api").sourceSets.main)
                sourceSet(project(":packages:minecraft-api").sourceSets.main)
                sourceSet(project(":packages:settings-api").sourceSets.main)
            }
            caustica_gltf_viewer {
                sourceSet(sourceSets.main)
            }
        }
    }
}

dependencies {
    compileOnly project(":packages:api")
    compileOnly project(":packages:minecraft-api")
    implementation project(":packages:examples:gltf-content")
    if (loader == "fabric") {
        runtimeOnly project(":packages:api")
        runtimeOnly project(":packages:minecraft-api")
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        localRuntime rootProject
    }

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testCompileOnly project(":packages:api")
    testCompileOnly project(":packages:minecraft-api")
    testCompileOnly project(":packages:settings-api")
    testRuntimeOnly project(":packages:api")
    testRuntimeOnly project(":packages:minecraft-api")
    testRuntimeOnly project(":packages:settings-api")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    doFirst {
        delete(destinationDir)
    }
    inputs.property "version", project.version
    inputs.property "neoforge_version", project.neoforge_version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": inputs.properties.version,
                "neoforge_version": inputs.properties.neoforge_version
    }
}

def checkApiBoundary = tasks.register("checkApiBoundary") {
    group = "verification"
    description = "Rejects viewer references outside the public APIs and reusable glTF content."
    inputs.files(sourceSets.main.allJava)
    dependsOn(tasks.named("jar"))
    inputs.file(tasks.named("jar", Jar).flatMap { it.archiveFile })
    doLast {
        def violations = []
        sourceSets.main.allJava.files.sort().each { source ->
            source.eachLine { line, number ->
                def packageDeclaration = line =~ /^\s*package\s+dev\.comfyfluffy\.caustica\.example\.gltfviewer\s*;/
                def allowedReference = line =~ /dev\.comfyfluffy\.caustica\.(?!api(?:\.|;)|minecraft\.api(?:\.|;)|example\.gltfcontent(?:\.|;)|example\.gltfviewer(?:\.|;))/
                if (!packageDeclaration.matches() && allowedReference.find()) {
                    violations.add("${project.relativePath(source)}:${number}: ${line.trim()}")
                }
            }
        }
        if (!violations.empty) {
            throw new GradleException("Minecraft glTF viewer crossed the Caustica API boundary:\n"
                    + violations.join("\n"))
        }
        def bundledApiClasses = []
        def bundledContentClasses = []
        def artifact = tasks.named("jar", Jar).get().archiveFile.get().asFile
        new java.util.jar.JarFile(artifact).withCloseable { jar ->
            def entries = jar.entries()
            while (entries.hasMoreElements()) {
                def name = entries.nextElement().name
                if (name.startsWith("dev/comfyfluffy/caustica/api/") && name.endsWith(".class")) {
                    bundledApiClasses.add(name)
                }
                if (name.startsWith("dev/comfyfluffy/caustica/example/gltfcontent/")
                        && name.endsWith(".class")) {
                    bundledContentClasses.add(name)
                }
            }
        }
        if (!bundledApiClasses.empty) {
            throw new GradleException("Standalone viewer bundled caustica-api classes: ${bundledApiClasses}")
        }
        if (bundledContentClasses.empty) {
            throw new GradleException("Standalone viewer did not embed reusable glTF content")
        }
    }
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

tasks.named("check") {
    dependsOn(checkApiBoundary, project(":packages:examples:gltf-content").tasks.named("check"))
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named("jar", Jar).configure {
    dependsOn(project(":packages:examples:gltf-content").tasks.named("classes"))
    from(project(":packages:examples:gltf-content").sourceSets.main.output)
    from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER", "THIRD_PARTY_NOTICES.md")) {
        into "META-INF"
    }
}
