plugins {
    id "java-library"
    id "maven-publish"
}

version = project.api_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
base { archivesName = "caustica-renderer-denoising" }
repositories { mavenCentral() }

dependencies {
    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def verifyRendererDenoisingImports = tasks.register("verifyRendererDenoisingImports") {
    inputs.files(sourceSets.main.allJava)
    doLast {
        def forbidden = ["org.lwjgl", "net.minecraft", "dev.comfyfluffy.caustica.minecraft",
                         "dev.comfyfluffy.caustica.nvidia", "dev.comfyfluffy.caustica.renderer.runtime",
                         "dev.comfyfluffy.caustica.renderer.raytracing"]
        def violations = []
        sourceSets.main.allJava.files.sort().each { source ->
            source.eachLine { line, number ->
                if (line.stripLeading().startsWith("import ") && forbidden.any { line.contains(it) }) {
                    violations += "${source}:${number}: ${line.trim()}"
                }
            }
        }
        if (!violations.empty) throw new GradleException("renderer-denoising boundary violations:\n${violations.join('\n')}")
    }
}

tasks.named("test", Test) { useJUnitPlatform() }
tasks.named("check") { dependsOn verifyRendererDenoisingImports }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar() }
tasks.named("jar", Jar).configure {
    from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER", "THIRD_PARTY_NOTICES.md")) { into "META-INF" }
}
publishing {
    publications { create("mavenJava", MavenPublication) { artifactId = "caustica-renderer-denoising"; from components.java } }
}
