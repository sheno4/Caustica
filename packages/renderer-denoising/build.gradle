plugins {
    id "java-library"
    id "maven-publish"
}

version = project.api_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
base { archivesName = "caustica-renderer-denoising" }
repositories { mavenCentral() }

dependencies {
    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test", Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar() }
tasks.named("jar", Jar).configure {
    from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER", "THIRD_PARTY_NOTICES.md")) { into "META-INF" }
}
publishing {
    publications { create("mavenJava", MavenPublication) { artifactId = "caustica-renderer-denoising"; from components.java } }
}
