plugins {
    id "java-library"
    id "java-test-fixtures"
    id "maven-publish"
}

version = project.api_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

base {
    archivesName = "caustica-api-settings"
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named("jar", Jar).configure {
    from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER")) {
        into "META-INF"
    }
}

def verifySettingsJar = tasks.register("verifySettingsJar") {
    group = "verification"
    description = "Verifies that the settings artifact ships only dev.comfyfluffy.caustica.settings classes."
    dependsOn(tasks.named("jar"))
    inputs.file(tasks.named("jar", Jar).flatMap { it.archiveFile })
    doLast {
        def jarPath = tasks.named("jar", Jar).get().archiveFile.get().asFile
        def strays = []
        new java.util.jar.JarFile(jarPath).withCloseable { jar ->
            def entries = jar.entries()
            while (entries.hasMoreElements()) {
                def name = entries.nextElement().name
                if (name.endsWith(".class")
                        && name.startsWith("dev/comfyfluffy/caustica/")
                        && !name.startsWith("dev/comfyfluffy/caustica/settings/")) {
                    strays.add(name)
                }
            }
        }
        if (!strays.empty) {
            throw new GradleException("caustica-api-settings contains non-settings classes: ${strays}")
        }
    }
}

tasks.named("check") {
    dependsOn(verifySettingsJar)
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "caustica-api-settings"
            from components.java
        }
    }
}
