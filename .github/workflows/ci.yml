name: CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "native/**"
      - "shaders/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "native/**"
      - "shaders/**"
      - "src/**"

env:
  DLSS_SDK_REF: v310.7.0
  DLSS_SDK_PATH: third_party/DLSS
  NGX_SHIM_CONFIG: release
  NGX_VENDOR_CONFIG: rel
  VULKAN_SDK_VERSION: 1.4.350.0
  VULKAN_SDK_SHA256: b65f068ab36263559da49d7cacd7e7b9df23824ca8b68ccc522a2b06f5725df2
  SLANG_VERSION: 2026.14.1
  SLANG_WINDOWS_SHA256: 5ed0a59d650a0af0aca45d5db4e083b3d8fb5cea05748747dd95dfbe9c580658
  SLANG_LINUX_SHA256: d7c02e044b5f2f4ceb8e220a2cf8f7d053418db1877da2656fb59e1ce545f8dd

jobs:
  native-windows:
    name: Build Windows native shims
    runs-on: windows-2022

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: Install Slang SDK
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/slang.zip"
          $destination = "$env:RUNNER_TEMP/slang-sdk"
          Invoke-WebRequest `
            -Uri "https://github.com/shader-slang/slang/releases/download/v$env:SLANG_VERSION/slang-$env:SLANG_VERSION-windows-x86_64.zip" `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:SLANG_WINDOWS_SHA256) {
            throw "Slang archive hash mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          "SLANG_SDK=$destination" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure NGX shim
        shell: pwsh
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
        run: >
          cmake -S native/ngx_shim
          -B build/cmake/ngx_shim
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build NGX shim
        shell: pwsh
        run: cmake --build build/cmake/ngx_shim --config Release

      - name: Configure Slang shim
        shell: pwsh
        run: >
          cmake -S native/slang_shim
          -B build/cmake/slang_shim
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build Slang shim
        shell: pwsh
        run: cmake --build build/cmake/slang_shim --config Release

      - name: Prepare Windows Slang runtime
        shell: pwsh
        run: |
          $destination = "build/slang-runtime-input/windows-x64"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item "build/native/slang_shim/release/causticaslang.dll" $destination
          Get-ChildItem "$env:SLANG_SDK/bin" -Filter "slang*.dll" | Copy-Item -Destination $destination
          Get-ChildItem "$env:SLANG_SDK/bin" -Directory -Filter "slang-standard-module-*" |
            Copy-Item -Destination $destination -Recurse

      - name: Upload Windows NGX shim
        uses: actions/upload-artifact@v4
        with:
          name: ngxshim-windows-x64
          path: build/native/ngx_shim/release/ngxshim.dll
          if-no-files-found: error

      - name: Upload Windows Slang runtime
        uses: actions/upload-artifact@v4
        with:
          name: slang-runtime-windows-x64
          path: build/slang-runtime-input
          if-no-files-found: error

  native-linux:
    name: Build Linux native shims
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: Install Slang SDK
        run: |
          archive="${RUNNER_TEMP}/slang.zip"
          destination="${RUNNER_TEMP}/slang-sdk"
          curl --fail --location --output "${archive}" \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.zip"
          echo "${SLANG_LINUX_SHA256}  ${archive}" | sha256sum --check
          unzip -q "${archive}" -d "${destination}"
          echo "SLANG_SDK=${destination}" >> "${GITHUB_ENV}"

      - name: Configure NGX shim
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
        run: >
          cmake -S native/ngx_shim
          -B build/cmake/ngx_shim
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build NGX shim
        run: cmake --build build/cmake/ngx_shim --config Release

      - name: Configure Slang shim
        run: >
          cmake -S native/slang_shim
          -B build/cmake/slang_shim
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Slang shim
        run: cmake --build build/cmake/slang_shim --config Release

      - name: Prepare Linux Slang runtime
        run: |
          destination="build/slang-runtime-input/linux-x64"
          mkdir -p "${destination}"
          cp "build/native/slang_shim/release/libcausticaslang.so" "${destination}/"
          find "${SLANG_SDK}/lib" -maxdepth 1 -type f -name 'libslang*.so*' -exec cp -L '{}' "${destination}/" \;
          find "${SLANG_SDK}/lib" -maxdepth 1 -type l -name 'libslang*.so*' -exec cp -L '{}' "${destination}/" \;
          find "${SLANG_SDK}/bin" -maxdepth 1 -type f -name 'libslang*.so*' -exec cp -L '{}' "${destination}/" \;
          find "${SLANG_SDK}" -maxdepth 3 -type d -name 'slang-standard-module-*' -exec cp -R '{}' "${destination}/" \;

      - name: Upload Linux NGX shim
        uses: actions/upload-artifact@v4
        with:
          name: ngxshim-linux-x64
          path: build/native/ngx_shim/release/libngxshim.so
          if-no-files-found: error

      - name: Upload Linux Slang runtime
        uses: actions/upload-artifact@v4
        with:
          name: slang-runtime-linux-x64
          path: build/slang-runtime-input
          if-no-files-found: error

  package:
    name: Build bundled mod jar
    runs-on: ubuntu-latest
    needs:
      - native-windows
      - native-linux

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan SDK shader tools
        run: |
          archive="vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          url="https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/${archive}"
          sdk_root="${RUNNER_TEMP}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64"

          curl --fail --location --retry 3 --retry-delay 5 --output "${archive}" "${url}"
          echo "${VULKAN_SDK_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/vulkan-sdk"
          tar -xf "${archive}" -C "${RUNNER_TEMP}/vulkan-sdk"

          echo "VULKAN_SDK=${sdk_root}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/bin" >> "${GITHUB_PATH}"
          "${sdk_root}/bin/glslangValidator" --version
          "${sdk_root}/bin/spirv-val" --version

      - name: Install Slang SDK
        run: |
          archive="${RUNNER_TEMP}/slang.zip"
          destination="${RUNNER_TEMP}/slang-sdk"
          curl --fail --location --output "${archive}" \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.zip"
          echo "${SLANG_LINUX_SHA256}  ${archive}" | sha256sum --check
          unzip -q "${archive}" -d "${destination}"
          echo "SLANG_SDK=${destination}" >> "${GITHUB_ENV}"
          echo "${destination}/bin" >> "${GITHUB_PATH}"
          "${destination}/bin/slangc" -version

      - name: Download NGX shims
        uses: actions/download-artifact@v4
        with:
          pattern: ngxshim-*
          path: build/native/ngx_shim/release
          merge-multiple: true

      - name: Download Slang runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: slang-runtime-*
          path: build/slang-runtime-input
          merge-multiple: true

      - name: Build bundled jar
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
        run: >
          bash ./gradlew build
          -PngxPlatforms=windows-x64,linux-x64
          -PngxVendorConfig=${{ env.NGX_VENDOR_CONFIG }}
          -PngxShimConfig=${{ env.NGX_SHIM_CONFIG }}
          -PslangPlatforms=windows-x64,linux-x64
          -PslangRuntimeInputRoot=build/slang-runtime-input

      - name: Upload bundled jar
        uses: actions/upload-artifact@v4
        with:
          name: caustica-bundled-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
