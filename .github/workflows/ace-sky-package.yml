name: ACE sky Windows package

on:
  push:
    branches: [ace-combat-sky]
    paths:
      - "packages/**"
      - ".github/workflows/ace-sky-package.yml"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ace-sky-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SLANG_VERSION: 2026.14.1
      SLANG_SHA256: 5ed0a59d650a0af0aca45d5db4e083b3d8fb5cea05748747dd95dfbe9c580658
      DLSS_SDK: ${{ github.workspace }}/third_party/DLSS
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: v310.7.0
          path: third_party/DLSS
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: v1.4.350
          path: third_party/Vulkan-Headers
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        shell: pwsh
        run: python -m pip install cmake==3.30.5
      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.350.0
          cache: true
      - name: Prepare pinned Slang SDK
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP 'slang.zip'
          $sdkPath = Join-Path $env:RUNNER_TEMP 'slang-sdk'
          Invoke-WebRequest -Uri "https://github.com/shader-slang/slang/releases/download/v$env:SLANG_VERSION/slang-$env:SLANG_VERSION-windows-x86_64.zip" -OutFile $archivePath
          if ((Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant() -ne $env:SLANG_SHA256) { throw 'Slang SDK hash mismatch' }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $sdkPath
          "SLANG_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            build/native/ngx_shim/release
            build/native/slang_shim/release
            packages/nvidia-nrd/build/generated/nrd-natives
          key: ace-sky-native-windows-x64-slang2026.14.1-dlss310.7.0-vulkan1.4.350-${{ hashFiles('packages/nvidia-ngx/native/**', 'packages/slang-runtime/native/**', 'packages/nvidia-nrd/native/**', 'packages/nvidia-nrd/build.gradle') }}
      - name: Build Windows runtime libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S packages/nvidia-ngx/native/ngx_shim -B build/cmake/ngx_shim -G "Visual Studio 17 2022" -A x64 "-DNGX_VULKAN_INCLUDE_DIR=$env:GITHUB_WORKSPACE/third_party/Vulkan-Headers/include"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/cmake/ngx_shim --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S packages/slang-runtime/native -B build/cmake/slang_shim -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/cmake/slang_shim --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./gradlew.bat :packages:nvidia-nrd:prepareNrdNativeDependencies :packages:nvidia-nrd:bundleNrdNative
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/native/ngx_shim/release
            build/native/slang_shim/release
            packages/nvidia-nrd/build/generated/nrd-natives
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Compile and package Fabric mod
        shell: pwsh
        run: ./gradlew.bat :packages:minecraft-client:jar -Ploader=fabric -PnrdNativeInputRoot=packages/nvidia-nrd/build/generated/nrd-natives
      - name: Compile and package NeoForge mod
        shell: pwsh
        run: ./gradlew.bat :packages:minecraft-client:jar -Ploader=neoforge -PbuildRoot=build-neoforge -PnrdNativeInputRoot=packages/nvidia-nrd/build/generated/nrd-natives
      - uses: actions/upload-artifact@v4
        with:
          name: ace-sky-windows-${{ github.sha }}
          path: |
            build/libs/*-fabric.jar
            build-neoforge/libs/*-neoforge.jar
          if-no-files-found: error
