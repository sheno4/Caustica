plugins {
	id "base"
	id "maven-publish"
	id "dev.comfyfluffy.caustica.slang-tooling"
	id "fabric-loom" version "${loom_version}" apply false
	id "net.neoforged.moddev" version "${neogradle_version}" apply false
}

version = project.mod_version
group = project.maven_group

def productionJavaByArtifact = [:]
def verifyJavaPackageOwnership = tasks.register("verifyJavaPackageOwnership") {
	group = "verification"
	description = "Verifies that each production Java package is owned by exactly one packages artifact."
	doLast {
		def owners = [:].withDefault { new TreeSet<String>() }
		productionJavaByArtifact.each { artifact, sources ->
			sources.files.findAll { it.isFile() && it.name.endsWith(".java") }.sort().each { source ->
				def declaration = source.getText("UTF-8") =~ /(?m)^\s*package\s+([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)\s*;/
				if (declaration.find()) owners[declaration.group(1)].add(artifact)
			}
		}
		def shared = owners.findAll { packageName, artifacts -> artifacts.size() > 1 }
		if (!shared.isEmpty()) {
			def violations = shared.keySet().sort().collect { packageName ->
				"${packageName}: ${shared[packageName].join(', ')}"
			}
			throw new GradleException("Production Java packages owned by multiple artifacts:\n${violations.join('\n')}")
		}
	}
}

def verifyShaderArtifactBoundaries = tasks.register("verifyShaderArtifactBoundaries") {
	group = "verification"
	description = "Rejects Gradle reads of another package's production shader source tree."
	def buildScripts = fileTree("packages") { include "**/build.gradle" }.files.sort()
	inputs.files(buildScripts)
	doLast {
		def crossProjectSource = ~/project\s*\([^)]*\)\s*\.(?:file|layout\.projectDirectory\.dir)\s*\(\s*["']src\/main\/resources/
		def rootedPackageSource = ~/rootProject(?:\.layout\.projectDirectory\.dir|\.file)\s*\(\s*["']packages\/[^"']+\/src\/main\/resources/
		def violations = []
		buildScripts.each { script ->
			def source = script.getText("UTF-8")
			[crossProjectSource, rootedPackageSource].each { pattern ->
				def matcher = source =~ pattern
				while (matcher.find()) {
					def line = source.substring(0, matcher.start()).count('\n') + 1
					violations.add("${relativePath(script)}:${line}: ${matcher.group().replaceAll(/\s+/, ' ')}")
				}
			}
		}
		if (!violations.isEmpty()) {
			throw new GradleException("Shader consumers must resolve package artifacts, not sibling sources:\n"
					+ violations.join("\n"))
		}
	}
}

subprojects { artifact ->
	artifact.pluginManager.withPlugin("java") {
		// Generated production Java is registered on main.allJava with builtBy metadata, so the
		// ownership check observes the same package set and generator dependencies as compilation.
		def productionJava = artifact.extensions.getByName("sourceSets").named("main").get().allJava
		productionJavaByArtifact[artifact.path] = productionJava
		verifyJavaPackageOwnership.configure { inputs.files(productionJava) }
	}
}

tasks.named("assemble") {
	dependsOn(":packages:minecraft-client:assemble")
}

tasks.named("check") {
	dependsOn(":packages:minecraft-client:check", verifyJavaPackageOwnership, verifyShaderArtifactBoundaries)
}

tasks.named("publish") {
	dependsOn(":packages:minecraft-client:publish")
}

tasks.named("publishToMavenLocal") {
	dependsOn(":packages:minecraft-client:publishToMavenLocal")
}

tasks.named("clean") {
	dependsOn(":packages:minecraft-client:clean")
}

def registerMinecraftClientTask = { String taskName ->
	def targetTask = ":packages:minecraft-client:${taskName}"
	tasks.register(taskName) {
		group = taskName.startsWith("run") ? "fabric" : "build"
		dependsOn(targetTask)
	}
}

["jar", "sourcesJar", "test", "compileShaders", "runClient", "runServer",
		"overlayHeapAbiTest", "verifyEmbeddedApi", "verifyRtBindingsGeneration"].each(registerMinecraftClientTask)

tasks.register("examplesCheck") {
	group = "verification"
	description = "Checks the public API showcase and both physical glTF example packages."
	dependsOn(project(":packages:examples:api-showcase").tasks.named("check"),
			project(":packages:examples:gltf-content").tasks.named("check"),
			project(":packages:examples:gltf-viewer-minecraft").tasks.named("check"))
}
