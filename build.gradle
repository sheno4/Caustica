	compileOnly project(":packages:slang-runtime")
	apiRuntime project(":packages:slang-runtime")
	compileOnly project(":packages:vulkan-support")
	apiRuntime project(":packages:vulkan-support")
	if (loader == "fabric") {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation project(":packages:api")
	testImplementation project(":packages:api-support")
	testImplementation project(":packages:config")
	testImplementation project(":packages:engine")
	testImplementation project(":packages:engine-vulkan")
	testImplementation project(":packages:features-builtin")
	testImplementation project(":packages:minecraft-api")
	testImplementation project(":packages:minecraft-adapter")
	testImplementation project(":packages:minecraft-content")
	testImplementation(testFixtures(project(":packages:minecraft-content")))
	testImplementation project(":packages:minecraft-rendering")
	testImplementation project(":packages:renderer-presentation")
	testImplementation project(":packages:renderer-raytracing")
	testImplementation project(":packages:settings-api")
	testImplementation project(":packages:slang-runtime")
	testImplementation project(":packages:vulkan-support")
	testRuntimeOnly project(":packages:api")
	testRuntimeOnly project(":packages:api-support")
	testRuntimeOnly project(":packages:config")
	testRuntimeOnly project(":packages:engine")
	testRuntimeOnly project(":packages:engine-vulkan")
	testRuntimeOnly project(":packages:features-builtin")
	testRuntimeOnly project(":packages:minecraft-api")
	testRuntimeOnly project(":packages:minecraft-adapter")
	testRuntimeOnly project(":packages:minecraft-content")
	testRuntimeOnly project(":packages:minecraft-rendering")
	testRuntimeOnly project(":packages:renderer-presentation")
	testRuntimeOnly project(":packages:renderer-raytracing")
	testRuntimeOnly project(":packages:settings-api")
	testRuntimeOnly project(":packages:slang-runtime")
	testRuntimeOnly project(":packages:vulkan-support")
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Layered TOML config (config/caustica.toml) — NightConfig, the same library NeoForge's
	// ModConfigSpec is built on.
	def nightConfigCore = implementation("com.electronwill.night-config:core:3.8.3")
	def nightConfigToml = implementation("com.electronwill.night-config:toml:3.8.3")
	if (loader == "fabric") {
		include nightConfigCore
		include nightConfigToml
	}

}

processResources {
	doFirst {
		delete(destinationDir)
	}
	inputs.property "version", project.version
	inputs.property "neoforge_version", project.neoforge_version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version,
				"neoforge_version": inputs.properties.neoforge_version
	}
}

// Compile Slang sources to SPIR-V at build time instead of tracking binaries. Requires slangc and
// spirv-val from the Vulkan SDK or PATH.
def shaderGenRoot = layout.buildDirectory.dir("generated/shaders") // classpath root -> /caustica/shaders/*.spv
def runtimeWorldSourceDir = project(":packages:renderer-raytracing")
		.file("src/main/resources/caustica/shaders/world")
def runtimeBuiltinSourceDir = project(":packages:features-builtin").file("src/main/resources/caustica/shaders/builtin")
def runtimeApiSourceDir = project(":packages:shader-api").file("src/main/resources/caustica/shaders/api")
def runtimeMinecraftSourceDir = file("src/main/resources/caustica/shaders/minecraft")
def runtimeMinecraftRenderingSourceDir = project(":packages:minecraft-rendering")
		.file("src/main/resources/caustica/shaders/minecraft")

def compileShaders = tasks.register("compileShaders", CompileSlangShaders) {
	group = "build"
	description = "Compiles shaders/** shader sources to SPIR-V and validates them."
	sourceDirectory = file("shaders")
	includeDirectories.from(runtimeWorldSourceDir, runtimeBuiltinSourceDir,
			runtimeApiSourceDir, runtimeMinecraftSourceDir, runtimeMinecraftRenderingSourceDir)
	aliasSourceDirectory = runtimeWorldSourceDir
	moduleAliases = [
			"radiance_any_hit_rahit.slang": "radiance_any_hit.rahit.slang",
			"shadow_any_hit_rahit.slang": "shadow_any_hit.rahit.slang"
	]
	outputDirectory = layout.buildDirectory.dir("generated/shaders/caustica/shaders")
}

def shaderReflectionRoot = layout.buildDirectory.dir("generated/shader-reflection-sources")
def prepareShaderReflectionSources = tasks.register("prepareShaderReflectionSources", Sync) {
	from(file("shaders"))
	from(runtimeWorldSourceDir) {
		into "pipelines/world"
	}
	from(runtimeBuiltinSourceDir) {
		into "builtin"
	}
	from(runtimeApiSourceDir) {
		into "api"
	}
	from(runtimeMinecraftSourceDir) {
		into "minecraft"
	}
	from(runtimeMinecraftRenderingSourceDir) {
		into "minecraft"
	}
	into(shaderReflectionRoot)
}

def generateShaderRecords = tasks.register("generateShaderRecords", GenerateShaderRecords) {
	group = "build"
	description = "Generates typed Java shader records and serializers from Slang reflection."
	dependsOn(prepareShaderReflectionSources)
	shaderRoot = shaderReflectionRoot
	probeSource = shaderReflectionRoot.map { it.file("layout/layout_probe.slang") }
	recordSpecs = [
			"buffer|minecraftImplementationLayoutProbe|MinecraftImplementationData|dev.comfyfluffy.caustica.minecraft.gen|MinecraftImplementationData|false",
			"buffer|minecraftEnvironmentBindingLayoutProbe|MinecraftEnvironmentBinding|dev.comfyfluffy.caustica.minecraft.sky.gen|MinecraftEnvironmentBindingData|false",
			"push|skyLutPushProbe|SkyInputs|dev.comfyfluffy.caustica.minecraft.sky.gen|SkyInputsData|false",
			"push|skyDispatchPushProbe|SkyLutPush|dev.comfyfluffy.caustica.minecraft.sky.gen|SkyLutPushData|false",
	]
	outDir = layout.buildDirectory.dir("generated/sources/rootShaderRecords")
}

def compileSkySlice = tasks.register("compileSkySlice", JavaCompile) {
	group = "verification"
	description = "Compiles the descriptor-heap Minecraft sky pass independently of legacy root consumers."
	dependsOn(generateShaderRecords, compileShaders, project(":packages:api").tasks.named("classes"),
			project(":packages:settings-api").tasks.named("classes"),
			project(":packages:minecraft-api").tasks.named("classes"),
			project(":packages:vulkan-support").tasks.named("classes"))
	source(file("src/main/java/dev/comfyfluffy/caustica/minecraft/sky/SkyLutPass.java"),
			file("src/main/java/dev/comfyfluffy/caustica/minecraft/MinecraftLightingCalibration.java"),
			layout.buildDirectory.file("generated/sources/rootShaderRecords/dev/comfyfluffy/caustica/minecraft/sky/gen/SkyInputsData.java"),
			layout.buildDirectory.file("generated/sources/rootShaderRecords/dev/comfyfluffy/caustica/minecraft/sky/gen/SkyLutPushData.java"),
			layout.buildDirectory.file("generated/sources/rootShaderRecords/dev/comfyfluffy/caustica/minecraft/sky/gen/MinecraftEnvironmentBindingData.java"))
	classpath = sourceSets.main.compileClasspath
	destinationDirectory = layout.buildDirectory.dir("classes/sky-slice")
	options.release = 25
}

def compileSkySliceTest = tasks.register("compileSkySliceTest", JavaCompile) {
	group = "verification"
