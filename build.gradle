import javax.inject.Inject
import org.gradle.process.ExecOperations
import groovy.json.JsonOutput
import java.security.MessageDigest
import dev.comfyfluffy.caustica.build.GenerateShaderRecords
import dev.comfyfluffy.caustica.build.GenerateRtBindings

plugins {
	id "fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	mavenCentral()
}

loom {
	runs {
		client {
			client()
			setConfigName("Fabric Client")
			ideConfigGenerated = true
			runDir = "run"
			// java.lang.foreign restricted methods (FFM bindings to amd_fidelityfx_vk.dll)
			vmArg "--enable-native-access=ALL-UNNAMED"

            // NVIDIA NGX (DLSS) allocates ~1MB on the stack during init, which overflows Java's default 1MB thread stack.
            // pass -Xss here directly so the main render thread is resized before the VM parses JAVA_TOOL_OPTIONS.
            vmArg "-Xss16m"

            // NixOS fix: Gradle forks drop the dev-shell's LD_LIBRARY_PATH.
            // We manually add the driver path so NGX can successfully dlopen libnvidia-ngx.so.1.
            if (file("/run/opengl-driver/lib").exists()) {
                def inherited = System.getenv("LD_LIBRARY_PATH")
                environmentVariable "LD_LIBRARY_PATH",
                        inherited ? "/run/opengl-driver/lib:${inherited}" : "/run/opengl-driver/lib"
            }
		}

		server {
			server()
			setConfigName("Fabric Server")
			ideConfigGenerated = true
			runDir = "run"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Layered TOML config (config/caustica.toml) — NightConfig, the same library NeoForge's
	// ModConfigSpec is built on.
	include implementation("com.electronwill.night-config:core:3.8.3")
	include implementation("com.electronwill.night-config:toml:3.8.3")

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Compile Slang sources to SPIR-V at build time instead of tracking binaries. Requires slangc and
// spirv-val from the Vulkan SDK or PATH.
def shaderGenRoot = layout.buildDirectory.dir("generated/shaders") // classpath root -> /caustica/shaders/*.spv
def runtimeWorldSourceDir = file("src/main/resources/caustica/shaders/world")
def runtimeBuiltinSourceDir = file("src/main/resources/caustica/shaders/builtin")
def runtimeApiSourceDir = file("src/main/resources/caustica/shaders/api")
def runtimeMinecraftSourceDir = file("src/main/resources/caustica/shaders/minecraft")

def resolveVulkanTool = { String name ->
	def exe = org.gradle.internal.os.OperatingSystem.current().windows ? ".exe" : ""
	def sdk = System.getenv("VULKAN_SDK")
	if (sdk) {
		def fromSdk = file("${sdk}/Bin/${name}${exe}")
		if (fromSdk.exists()) {
			return fromSdk.absolutePath
		}
	}
	return "${name}${exe}" // fall back to PATH; exec fails with a clear message if absent
}

def resolveSlangTool = { String name ->
	def exe = org.gradle.internal.os.OperatingSystem.current().windows ? ".exe" : ""
	def sdk = System.getenv("SLANG_SDK")
	if (sdk) {
		def fromSdk = file("${sdk}/bin/${name}${exe}")
		if (fromSdk.exists()) {
			return fromSdk.absolutePath
		}
	}
	return "${name}${exe}"
}

abstract class CompileShaders extends DefaultTask {
	@InputDirectory abstract DirectoryProperty getSrcDir()
	@InputDirectory abstract DirectoryProperty getRuntimeWorldDir()
	@InputDirectory abstract DirectoryProperty getRuntimeApiDir()
	@OutputDirectory abstract DirectoryProperty getOutDir()
	@Input abstract Property<String> getSpirvVal()
	@Input abstract Property<String> getSlangc()

	@Inject abstract ExecOperations getExecOps()

	// pipelines/display/main.comp.slang -> pipelines/display/main.comp.
	static String outBase(File root, File src) {
		def relative = root.toPath().relativize(src.toPath()).toString().replace('\\', '/')
		return relative.endsWith(".slang") ? relative.substring(0, relative.length() - 6) : relative
	}

	@TaskAction
	void compile() {
		def outDirFile = outDir.get().asFile
		// Slang stages are named <name>.<stage>.slang (any_hit.rahit.slang -> any_hit.rahit.spv); module files
		// like world_common.slang match no stage glob and are picked up only via `import`.
		def stageIncludes = ["rgen", "rchit", "rahit", "rmiss", "rcall", "comp", "vert", "frag"]
				.collect { stage -> "**/*.${stage}.slang" }
		def validate = { File spv ->
			execOps.exec {
				commandLine spirvVal.get(), "--target-env", "vulkan1.2", spv.absolutePath
			}
		}
		def includeDirs = ([runtimeWorldDir.get().asFile, runtimeApiDir.get().asFile]
				+ srcDir.get().asFileTree.matching { include "**/*.slang" }.files.collect { it.parentFile })
				.unique().sort { it.absolutePath }
		def compileOneSlang = { File src, File spv, List<String> extra ->
			spv.parentFile.mkdirs()
			def includes = [src.parentFile] + includeDirs.findAll { it != src.parentFile }
			execOps.exec {
				// Embed Slang source and line mappings in SPIR-V for RenderDoc/Nsight source debugging.
				commandLine([slangc.get(), src.absolutePath, "-target", "spirv",
						"-profile", "spirv_1_5", "-matrix-layout-column-major",
						"-warnings-as-errors", "all", "-warnings-disable", "41012", "-g"]
						+ includes.collectMany { ["-I", it.absolutePath] } + extra
						+ ["-o", spv.absolutePath])
			}
			validate(spv)
		}
		def shaderFiles = srcDir.get().asFileTree.matching {
			include stageIncludes
		}.files.sort { it.absolutePath }
		def duplicateOutputs = shaderFiles
				.groupBy { "${outBase(srcDir.get().asFile, it)}.spv" }
				.findAll { entry -> entry.value.size() > 1 }
		if (!duplicateOutputs.isEmpty()) {
			throw new GradleException("Duplicate shader output name(s): "
					+ duplicateOutputs.collect { entry -> "${entry.key} from ${entry.value*.path.join(', ')}" }.join("; "))
		}
		// Compile into Gradle's task-temporary directory. A compiler or validator failure leaves the last
		// successful published output intact instead of emptying build/generated/shaders halfway through.
		def scratchDir = new File(temporaryDir, "spv")
		if (scratchDir.exists() && !scratchDir.deleteDir()) {
			throw new GradleException("failed to clear shader scratch directory ${scratchDir}")
		}
		scratchDir.mkdirs()
		shaderFiles.each { src ->
			def base = outBase(srcDir.get().asFile, src)
			compileOneSlang(src, new File(scratchDir, "${base}.spv"), [])
		}
		if (outDirFile.exists() && !outDirFile.deleteDir()) {
			throw new GradleException("failed to clear generated shaders under ${outDirFile}")
		}
		outDirFile.mkdirs()
		scratchDir.eachFileRecurse(groovy.io.FileType.FILES) { src ->
			def relative = scratchDir.toPath().relativize(src.toPath())
			def destination = outDirFile.toPath().resolve(relative).toFile()
			destination.parentFile.mkdirs()
			java.nio.file.Files.move(src.toPath(), destination.toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
}

def compileShaders = tasks.register("compileShaders", CompileShaders) {
	group = "build"
	description = "Compiles shaders/** shader sources to SPIR-V and validates them."
	srcDir = file("shaders")
	runtimeWorldDir = runtimeWorldSourceDir
	runtimeApiDir = runtimeApiSourceDir
	outDir = layout.buildDirectory.dir("generated/shaders/caustica/shaders")
	spirvVal = resolveVulkanTool("spirv-val")
	slangc = resolveSlangTool("slangc")
}

def shaderReflectionRoot = layout.buildDirectory.dir("generated/shader-reflection-sources")
def prepareShaderReflectionSources = tasks.register("prepareShaderReflectionSources", Sync) {
	from(file("shaders"))
	from(runtimeWorldSourceDir) {
		into "pipelines/world"
	}
	from(runtimeBuiltinSourceDir) {
		into "builtin"
	}
	from(runtimeApiSourceDir) {
		into "api"
	}
	from(runtimeMinecraftSourceDir) {
		into "minecraft"
	}
	into(shaderReflectionRoot)
}

def generateShaderRecords = tasks.register("generateShaderRecords", GenerateShaderRecords) {
	group = "build"
	description = "Generates typed Java shader records and serializers from Slang reflection."
	dependsOn(prepareShaderReflectionSources)
	shaderRoot = shaderReflectionRoot
	probeSource = shaderReflectionRoot.map { it.file("layout/layout_probe.slang") }
	slangc = resolveSlangTool("slangc")
	spirvVal = resolveVulkanTool("spirv-val")
	outDir = layout.buildDirectory.dir("generated/sources/shaderRecords")
}

def rtBindingsGenRoot = layout.buildDirectory.dir("generated/sources/rtBindings")
def generateRtBindings = tasks.register("generateRtBindings", GenerateRtBindings) {
	group = "build"
	description = "Generates Java descriptor bindings from Slang reflection."
	dependsOn(prepareShaderReflectionSources)
	shaderRoot = shaderReflectionRoot
	slangc = resolveSlangTool("slangc")
	outDir = rtBindingsGenRoot
}

tasks.named("test", Test) {
	useJUnitPlatform()
}

sourceSets.main.java.srcDir(files(layout.buildDirectory.dir("generated/sources/shaderRecords")).builtBy(generateShaderRecords))
sourceSets.main.java.srcDir(files(rtBindingsGenRoot).builtBy(generateRtBindings))

// Emit the .spv into the main resources so they land in the jar / on the runClient classpath at the
// same /caustica/shaders/ path the pipeline loaders read. builtBy wires the dependency.
sourceSets.main.resources.srcDir(files(shaderGenRoot).builtBy(compileShaders))

def slangRuntimeVersion = project.property("slang_runtime_version").toString()
def slangRuntimeGenRoot = layout.buildDirectory.dir("generated/slang-runtime")
def slangRuntimeInputRoot = providers.gradleProperty("slangRuntimeInputRoot").map { file(it) }
def slangShimConfig = (findProperty("slangShimConfig") ?: "release").toString().toLowerCase(java.util.Locale.ROOT)
def slangShimOutDir = layout.buildDirectory.dir("native/slang_shim/${slangShimConfig}").get().asFile
def currentSlangPlatform = {
	def os = org.gradle.internal.os.OperatingSystem.current()
	def arch = System.getProperty("os.arch", "").toLowerCase(java.util.Locale.ROOT)
	def x64 = arch == "x86_64" || arch == "amd64"
	if (os.windows && x64) {
		return "windows-x64"
	}
	if (os.linux && x64) {
		return "linux-x64"
	}
	return null
}()
def requestedSlangPlatforms = (findProperty("slangPlatforms") ?: "current").toString()
		.split(",")
		.collect { it.trim() }
		.findAll { !it.isEmpty() }
		.collect { it == "current" ? currentSlangPlatform : it }
def supportedSlangPlatforms = ["windows-x64", "linux-x64"]
if (requestedSlangPlatforms.any { it == null || !supportedSlangPlatforms.contains(it) }) {
	throw new GradleException("Unsupported Slang runtime platform(s): ${requestedSlangPlatforms}")
}

def bundleSlangRuntime = tasks.register("bundleSlangRuntime") {
	group = "build"
	description = "Bundles the Slang shared-library compiler runtime into mod resources."
	inputs.property "slangRuntimeVersion", slangRuntimeVersion
	inputs.property "slangPlatforms", requestedSlangPlatforms.join(",")
	inputs.property "slangShimConfig", slangShimConfig
	if (slangRuntimeInputRoot.isPresent()) {
		inputs.dir(slangRuntimeInputRoot)
	} else {
		inputs.dir(slangShimOutDir)
		def sdk = System.getenv("SLANG_SDK")
		if (sdk) {
			inputs.files(fileTree(new File(sdk, "bin")) {
				include "slang*.dll"
				include "slang-standard-module-*/**"
			})
			inputs.files(fileTree(new File(sdk, "bin")) {
				include "libslang*.so*"
				include "slang-standard-module-*/**"
			})
			inputs.files(fileTree(new File(sdk, "lib")) {
				include "libslang*.so*"
				include "slang-standard-module-*/**"
			})
		}
	}
	outputs.dir(slangRuntimeGenRoot)

	doLast {
		def outputRoot = slangRuntimeGenRoot.get().asFile
		delete(outputRoot)
		def scratchRoot = new File(temporaryDir, "runtime")
		delete(scratchRoot)
		scratchRoot.mkdirs()

		requestedSlangPlatforms.each { platform ->
			def destination = new File(scratchRoot,
					"caustica/natives/slang/${slangRuntimeVersion}/${platform}")
			destination.mkdirs()
			if (slangRuntimeInputRoot.isPresent()) {
				def source = new File(slangRuntimeInputRoot.get(), platform)
				if (!source.isDirectory()) {
					throw new GradleException("Missing prepared Slang runtime directory ${source}")
				}
				copy {
					from(source)
					exclude "runtime.json"
					into(destination)
				}
			} else {
				if (platform != currentSlangPlatform) {
					throw new GradleException("Platform ${platform} requires -PslangRuntimeInputRoot")
				}
				def sdkPath = System.getenv("SLANG_SDK")
				if (!sdkPath) {
					throw new GradleException("SLANG_SDK environment variable is not set")
				}
				def sdk = file(sdkPath)
				copy {
					from(slangShimOutDir) {
						include platform == "windows-x64" ? "causticaslang.dll" : "libcausticaslang.so"
					}
					if (platform == "windows-x64") {
						from(new File(sdk, "bin")) {
							include "slang*.dll"
							include "slang-standard-module-*/**"
						}
					} else {
						from(new File(sdk, "lib")) {
							include "libslang*.so*"
							include "slang-standard-module-*/**"
						}
						from(new File(sdk, "bin")) {
							include "libslang*.so*"
							include "slang-standard-module-*/**"
						}
					}
					into(destination)
				}
			}

			def shimName = platform == "windows-x64" ? "causticaslang.dll" : "libcausticaslang.so"
			def coreName = platform == "windows-x64" ? "slang.dll" : "libslang.so"
			def compilerName = platform == "windows-x64" ? "slang-compiler.dll" : "libslang-compiler.so"
			def missing = [shimName, coreName, compilerName].findAll { !new File(destination, it).isFile() }
			if (!missing.empty) {
				throw new GradleException("Incomplete Slang runtime for ${platform}; missing ${missing.join(', ')}")
			}

			def files = fileTree(destination).files.sort { a, b -> a.path <=> b.path }
			def digest = { File source ->
				def md = MessageDigest.getInstance("SHA-256")
				source.withInputStream { input ->
					byte[] buffer = new byte[64 * 1024]
					for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
						if (read > 0) md.update(buffer, 0, read)
					}
				}
				return md.digest().encodeHex().toString()
			}
			def entries = files.collect { source ->
				[
					path: destination.toPath().relativize(source.toPath()).toString().replace('\\', '/'),
					size: source.length(),
					sha256: digest(source),
				]
			}
			def bundleDigest = MessageDigest.getInstance("SHA-256")
			entries.each { entry ->
				bundleDigest.update(entry.path.getBytes(java.nio.charset.StandardCharsets.UTF_8))
				bundleDigest.update((byte) 0)
				bundleDigest.update(entry.sha256.getBytes(java.nio.charset.StandardCharsets.US_ASCII))
			}
			def manifest = [
				format: 1,
				abi: 2,
				slangVersion: slangRuntimeVersion,
				platform: platform,
				shim: shimName,
				bundleSha256: bundleDigest.digest().encodeHex().toString(),
				files: entries,
			]
			new File(destination, "runtime.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + "\n"
		}
		def indexFile = new File(scratchRoot, "caustica/natives/slang/runtime.json")
		indexFile.parentFile.mkdirs()
		indexFile.text = JsonOutput.prettyPrint(JsonOutput.toJson([
			format: 1,
			slangVersion: slangRuntimeVersion,
			platforms: requestedSlangPlatforms,
		])) + "\n"

		copy {
			from(scratchRoot)
			into(outputRoot)
		}
	}
}

sourceSets.main.resources.srcDir(files(slangRuntimeGenRoot).builtBy(bundleSlangRuntime))

tasks.named("test", Test) {
	dependsOn(bundleSlangRuntime)
	jvmArgs "--enable-native-access=ALL-UNNAMED"
	doFirst {
		def slangRuntimeDir = new File(slangRuntimeGenRoot.get().asFile,
				"caustica/natives/slang/${slangRuntimeVersion}/${currentSlangPlatform}").absolutePath
		systemProperty "caustica.test.slangRuntimeDir", slangRuntimeDir
		systemProperty "caustica.test.slangVersion", slangRuntimeVersion
		systemProperty "caustica.test.spirvVal", resolveVulkanTool("spirv-val")
		// SlangRuntime normally locates its extracted natives through FabricLoader's game directory,
		// which does not exist under plain JUnit. The same override players can use to point at a local
		// Slang build lets tests exercise the real runtime path (session creation, module search paths)
		// instead of only the lower-level SlangLibrary calls.
		systemProperty "caustica.slang.path", slangRuntimeDir
	}
}

def ngxNativeGenRoot = layout.buildDirectory.dir("generated/ngx-natives")
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase(java.util.Locale.ROOT) }
def isRunClientInvocation = requestedTaskNames.any { it == "runclient" || it.endsWith(":runclient") }
def ngxShimConfig = (findProperty("ngxShimConfig") ?: findProperty("ngxNativeConfig") ?: "release")
		.toString().toLowerCase(java.util.Locale.ROOT)
def normalizeNgxVendorConfig = { String config ->
	def normalized = config.toLowerCase(java.util.Locale.ROOT)
	if (normalized == "release") {
		return "rel"
	}
	if (normalized == "debug") {
		return "dev"
	}
	if (normalized != "rel" && normalized != "dev") {
		throw new GradleException("Unknown NGX vendor config '${config}'. Expected 'rel' or 'dev'.")
	}
	return normalized
}
def ngxVendorConfig = normalizeNgxVendorConfig(
		(findProperty("ngxVendorConfig") ?: (isRunClientInvocation ? "dev" : "rel")).toString())
def ngxNativeRoot = layout.buildDirectory.dir("native/ngx_shim").get().asFile
def ngxShimOutDir = new File(ngxNativeRoot, ngxShimConfig)
def currentNgxPlatform = {
	def os = org.gradle.internal.os.OperatingSystem.current()
	def arch = System.getProperty("os.arch", "").toLowerCase(java.util.Locale.ROOT)
	def x64 = arch == "x86_64" || arch == "amd64"
	if (os.windows && x64) {
		return "windows-x64"
	}
	if (os.linux && x64) {
		return "linux-x64"
	}
	return null
}()
def ngxNativePlatforms = [
	[
		name: "windows-x64",
		shimIncludes: [
			"ngxshim.dll"
		],
		vendorRoot: { dlssSdkRoot, vendorConfig -> new File(dlssSdkRoot, "lib/Windows_x86_64/${vendorConfig}") },
		vendorIncludes: [
			"nvngx_dlssd.dll",
			"nvngx_dlssg.dll"
		]
	],
	[
		name: "linux-x64",
		shimIncludes: [
			"libngxshim.so"
		],
		vendorRoot: { dlssSdkRoot, vendorConfig -> new File(dlssSdkRoot, "lib/Linux_x86_64/${vendorConfig}") },
		vendorIncludes: [
			"libnvidia-ngx-dlssd.so*",
			"libnvidia-ngx-dlssg.so*"
		]
	]
]
def ngxNativePlatformByName = ngxNativePlatforms.collectEntries { platform -> [(platform.name): platform] }
def requestedNgxPlatformsRaw = (findProperty("ngxPlatforms") ?: "current").toString()
		.split(",")
		.collect { it.trim() }
		.findAll { !it.isEmpty() }
def selectedNgxNativePlatforms
if (requestedNgxPlatformsRaw.size() == 1 && requestedNgxPlatformsRaw[0].equalsIgnoreCase("all")) {
	selectedNgxNativePlatforms = ngxNativePlatforms
} else if (requestedNgxPlatformsRaw.size() == 1 && requestedNgxPlatformsRaw[0].equalsIgnoreCase("current")) {
	if (currentNgxPlatform == null || !ngxNativePlatformByName.containsKey(currentNgxPlatform)) {
		throw new GradleException("No NGX native platform is configured for this host.")
	}
	selectedNgxNativePlatforms = [ngxNativePlatformByName[currentNgxPlatform]]
} else {
	def unknownPlatforms = requestedNgxPlatformsRaw.findAll { !ngxNativePlatformByName.containsKey(it) }
	if (!unknownPlatforms.empty) {
		throw new GradleException("Unknown NGX platform(s): ${unknownPlatforms.join(', ')}")
	}
	selectedNgxNativePlatforms = requestedNgxPlatformsRaw.collect { ngxNativePlatformByName[it] }
}

def dlssSdkEnv = providers.environmentVariable("DLSS_SDK")
def dlssSdkRootProvider = dlssSdkEnv.map { file(it) }

def bundleNgxNatives = tasks.register("bundleNgxNatives") {
	group = "build"
	description = "Bundles NGX shim and ${ngxVendorConfig} DLSS native libraries into the mod resources."

	inputs.property "ngxShimConfig", ngxShimConfig
	inputs.property "ngxVendorConfig", ngxVendorConfig

	selectedNgxNativePlatforms.each { platform ->
		inputs.files(fileTree(ngxShimOutDir) {
			include platform.shimIncludes
		}).withPropertyName("ngxNatives.${platform.name}.shim")
		inputs.files(fileTree(platform.vendorRoot(dlssSdkRootProvider.getOrElse(file("__missing_dlss_sdk__")), ngxVendorConfig)) {
			include platform.vendorIncludes
		}).withPropertyName("ngxNatives.${platform.name}.vendor")
	}
	outputs.dir(ngxNativeGenRoot)
	outputs.upToDateWhen { false }

	doLast {
		delete(ngxNativeGenRoot)
		def missing = []
		def dlssSdkRoot = dlssSdkRootProvider.orNull
		if (dlssSdkRoot == null) {
			throw new GradleException("DLSS_SDK environment variable is not set.")
		}
		selectedNgxNativePlatforms.each { platform ->
			def platformShimFiles = fileTree(ngxShimOutDir) {
				include platform.shimIncludes
			}.files
			if (platformShimFiles.empty) {
				missing += "${platform.name} shim library in ${ngxShimOutDir}"
			}
		}
		selectedNgxNativePlatforms.each { platform ->
			def platformVendorRoot = platform.vendorRoot(dlssSdkRoot, ngxVendorConfig)
			def missingVendorIncludes = platform.vendorIncludes.findAll { vendorInclude ->
				fileTree(platformVendorRoot) {
					include vendorInclude
				}.files.empty
			}
			if (!missingVendorIncludes.empty) {
				missing += "${platform.name} vendor libraries ${missingVendorIncludes.join(', ')} in ${platformVendorRoot}"
			}
		}
		if (!missing.empty) {
			throw new GradleException("Missing NGX native inputs:\n - " + missing.join("\n - "))
		}

		copy {
			selectedNgxNativePlatforms.each { platform ->
				from(fileTree(ngxShimOutDir) {
					include platform.shimIncludes
				}) {
					into "caustica/natives/${platform.name}"
				}
				from(fileTree(platform.vendorRoot(dlssSdkRoot, ngxVendorConfig))) {
					include platform.vendorIncludes
					into "caustica/natives/${platform.name}"
				}
			}
			into ngxNativeGenRoot
		}
	}
}

sourceSets.main.resources.srcDir(files(ngxNativeGenRoot).builtBy(bundleNgxNatives))

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

tasks.named("jar", Jar).configure {
	from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER", "THIRD_PARTY_NOTICES.md")) {
		into "META-INF"
	}
}

publishing {
