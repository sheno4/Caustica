import groovy.json.JsonOutput
import java.security.MessageDigest
import dev.comfyfluffy.caustica.slangtooling.CompileSlangShaders
import dev.comfyfluffy.caustica.slangtooling.GenerateShaderRecords
import dev.comfyfluffy.caustica.slangtooling.ReflectSlang

plugins {
	id "dev.comfyfluffy.caustica.slang-tooling"
	id "fabric-loom" version "${loom_version}" apply false
	id "net.neoforged.moddev" version "${neogradle_version}" apply false
	id "maven-publish"
}

evaluationDependsOn(":packages:api")
evaluationDependsOn(":packages:minecraft-rendering")
evaluationDependsOn(":packages:renderer-presentation")
evaluationDependsOn(":packages:renderer-raytracing")
evaluationDependsOn(":packages:slang-runtime")

def loader = (findProperty("loader") ?: "fabric").toString().toLowerCase(Locale.ROOT)
if (!(loader in ["fabric", "neoforge"])) {
	throw new GradleException("Unknown loader '${loader}'. Expected 'fabric' or 'neoforge'.")
}
apply plugin: loader == "fabric" ? "fabric-loom" : "net.neoforged.moddev"

version = project.mod_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def buildRoot = providers.gradleProperty("buildRoot").orElse("build").get()
layout.buildDirectory = layout.projectDirectory.dir(buildRoot)

base {
	archivesName = project.archives_base_name
}

// Obfuscation is disabled for this development build, so `jar` is the loader-specific shippable artifact.
tasks.named("jar") {
	archiveClassifier = loader
}

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = "NeoForge"
		url = "https://maven.neoforged.net/releases"
	}
	mavenCentral()
}

sourceSets.main.java.srcDir("src/${loader}/java")
sourceSets.main.resources.srcDir("src/${loader}/resources")

// The renderer only attaches to the Vulkan backend, so every dev client run needs these.
def CLIENT_PROGRAM_ARGUMENTS = ["--renderDebugLabels", "--graphicsBackend", "VULKAN"]
def quickPlayWorld = findProperty("quickPlayWorld")?.toString()
if (quickPlayWorld) {
	CLIENT_PROGRAM_ARGUMENTS.addAll("--quickPlaySingleplayer", quickPlayWorld)
}

// Heap and GC tuning for dev client runs only. These belong on the run configuration rather than
// JAVA_TOOL_OPTIONS, which every forked JVM inherits — including NeoForge's JDK 21 tooling JVM, which
// rejects newer flags and fails the run before the game starts.
def CLIENT_JVM_ARGUMENTS = ["-Xmx8G", "-XX:+UseStringDeduplication", "-XX:+UseZGC"]

if (loader == "fabric") {
	loom {
		runs {
			client {
				client()
				setConfigName("Fabric Client")
				ideConfigGenerated = true
				runDir = "run"
				vmArg "--enable-native-access=ALL-UNNAMED"
				vmArg "-Xss16m"
				CLIENT_JVM_ARGUMENTS.each { vmArg it }
				programArgs CLIENT_PROGRAM_ARGUMENTS
				if (file("/run/opengl-driver/lib").exists()) {
					def inherited = System.getenv("LD_LIBRARY_PATH")
					environmentVariable "LD_LIBRARY_PATH",
							inherited ? "/run/opengl-driver/lib:${inherited}" : "/run/opengl-driver/lib"
				}
			}
			server {
				server()
				setConfigName("Fabric Server")
				ideConfigGenerated = true
				runDir = "run"
			}
		}
	}
} else {
	neoForge {
		version = project.neoforge_version
		runs {
			client {
				client()
				jvmArgument "--enable-native-access=ALL-UNNAMED"
				jvmArgument "-Xss16m"
				CLIENT_JVM_ARGUMENTS.each { jvmArgument it }
				// devlaunch reads the main class from the first program argument, so Gradle's --args
				// cannot carry these; the run configuration owns them for both loaders instead.
				programArguments.addAll(CLIENT_PROGRAM_ARGUMENTS)
			}
			server {
				server()
			}
		}
		mods {
			caustica {
				sourceSet(sourceSets.main)
				sourceSet(project(":packages:api").sourceSets.main)
				sourceSet(project(":packages:api-support").sourceSets.main)
				sourceSet(project(":packages:config").sourceSets.main)
				sourceSet(project(":packages:engine").sourceSets.main)
				sourceSet(project(":packages:engine-vulkan").sourceSets.main)
				sourceSet(project(":packages:features-builtin").sourceSets.main)
				sourceSet(project(":packages:minecraft-api").sourceSets.main)
				sourceSet(project(":packages:minecraft-adapter").sourceSets.main)
				sourceSet(project(":packages:minecraft-content").sourceSets.main)
				sourceSet(project(":packages:minecraft-rendering").sourceSets.main)
				sourceSet(project(":packages:renderer-presentation").sourceSets.main)
				sourceSet(project(":packages:renderer-raytracing").sourceSets.main)
				sourceSet(project(":packages:settings-api").sourceSets.main)
				sourceSet(project(":packages:shader-api").sourceSets.main)
				sourceSet(project(":packages:slang-runtime").sourceSets.main)
				sourceSet(project(":packages:vulkan-support").sourceSets.main)
			}
		}
		unitTest {
			enable()
			testedMod = mods.caustica
		}
	}
}

configurations {
	apiRuntime
}
sourceSets.main.runtimeClasspath += configurations.apiRuntime

dependencies {
	compileOnly project(":packages:api")
	apiRuntime project(":packages:api")
	compileOnly project(":packages:api-support")
	apiRuntime project(":packages:api-support")
	compileOnly project(":packages:config")
	apiRuntime project(":packages:config")
	compileOnly project(":packages:engine")
	apiRuntime project(":packages:engine")
	compileOnly project(":packages:engine-vulkan")
	apiRuntime project(":packages:engine-vulkan")
	compileOnly project(":packages:features-builtin")
	apiRuntime project(":packages:features-builtin")
	compileOnly project(":packages:minecraft-api")
	apiRuntime project(":packages:minecraft-api")
	compileOnly project(":packages:minecraft-adapter")
	apiRuntime project(":packages:minecraft-adapter")
	compileOnly project(":packages:minecraft-content")
	apiRuntime project(":packages:minecraft-content")
	compileOnly project(":packages:minecraft-rendering")
	apiRuntime project(":packages:minecraft-rendering")
	compileOnly project(":packages:renderer-presentation")
	apiRuntime project(":packages:renderer-presentation")
	compileOnly project(":packages:renderer-raytracing")
	apiRuntime project(":packages:renderer-raytracing")
