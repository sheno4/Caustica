plugins {
    id "fabric-loom" version "${loom_version}" apply false
    id "net.neoforged.moddev" version "${neogradle_version}" apply false
}

def loader = (findProperty("loader") ?: "fabric").toString().toLowerCase(Locale.ROOT)
if (!(loader in ["fabric", "neoforge"])) {
    throw new GradleException("Unknown loader '${loader}'. Expected 'fabric' or 'neoforge'.")
}
apply plugin: loader == "fabric" ? "fabric-loom" : "net.neoforged.moddev"

version = rootProject.version
group = rootProject.group
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

base {
    archivesName = "caustica-gltf-viewer"
}

tasks.named("jar") {
    archiveClassifier = loader
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "NeoForge"
        url = "https://maven.neoforged.net/releases"
    }
    mavenCentral()
}

sourceSets.main.java.srcDir("src/${loader}/java")
sourceSets.main.resources.srcDir("src/${loader}/resources")

def clientProgramArguments = ["--renderDebugLabels", "--graphicsBackend", "VULKAN"]
def quickPlayWorld = findProperty("quickPlayWorld")?.toString()
if (quickPlayWorld) {
    clientProgramArguments.addAll("--quickPlaySingleplayer", quickPlayWorld)
}

if (loader == "fabric") {
    loom {
        runs {
            client {
                client()
                setConfigName("glTF Viewer Extension Client")
                runDir = rootProject.file("run")
                vmArg "--enable-native-access=ALL-UNNAMED"
                vmArg "-Xss16m"
                vmArg "-Xmx8G"
                vmArg "-XX:+UseZGC"
                programArgs clientProgramArguments
            }
        }
    }
} else {
    neoForge {
        version = project.neoforge_version
        runs {
            client {
                client()
                gameDirectory = rootProject.file("run")
                jvmArgument "--enable-native-access=ALL-UNNAMED"
                jvmArgument "-Xss16m"
                jvmArgument "-Xmx8G"
                jvmArgument "-XX:+UseZGC"
                programArguments.addAll(clientProgramArguments)
            }
        }
        mods {
            caustica {
                sourceSet(rootProject.sourceSets.main)
                sourceSet(project(":packages:api").sourceSets.main)
            }
            caustica_gltf_viewer {
                sourceSet(sourceSets.main)
            }
        }
        unitTest {
            enable()
            testedMod = mods.caustica_gltf_viewer
        }
    }
}

dependencies {
    compileOnly project(":packages:api")
    runtimeOnly project(":packages:api")
    if (loader == "fabric") {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        runtimeOnly rootProject
    }

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation project(":packages:api")
    testImplementation rootProject
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    doFirst {
        delete(destinationDir)
    }
    inputs.property "version", project.version
    inputs.property "neoforge_version", project.neoforge_version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": inputs.properties.version,
                "neoforge_version": inputs.properties.neoforge_version
    }
}

def checkApiBoundary = tasks.register("checkApiBoundary") {
    group = "verification"
    description = "Rejects extension references to Caustica implementation packages."
    inputs.files(sourceSets.main.allJava)
    dependsOn(tasks.named("jar"))
    inputs.file(tasks.named("jar", Jar).flatMap { it.archiveFile })
    doLast {
        def violations = []
        sourceSets.main.allJava.files.sort().each { source ->
            source.eachLine { line, number ->
                def packageDeclaration = line =~ /^\s*package\s+dev\.comfyfluffy\.caustica\.example\.gltfviewer\s*;/
                def implementationReference = line =~ /dev\.comfyfluffy\.caustica\.(?!api(?:\.|;))/
                if (!packageDeclaration.matches() && implementationReference.find()) {
                    violations.add("${project.relativePath(source)}:${number}: ${line.trim()}")
                }
            }
        }
        if (!violations.empty) {
            throw new GradleException("Standalone extension crossed the Caustica API boundary:\n"
                    + violations.join("\n"))
        }
        def bundledApiClasses = []
        def artifact = tasks.named("jar", Jar).get().archiveFile.get().asFile
        new java.util.jar.JarFile(artifact).withCloseable { jar ->
            def entries = jar.entries()
            while (entries.hasMoreElements()) {
                def name = entries.nextElement().name
                if (name.startsWith("dev/comfyfluffy/caustica/api/") && name.endsWith(".class")) {
                    bundledApiClasses.add(name)
                }
            }
        }
        if (!bundledApiClasses.empty) {
            throw new GradleException("Standalone extension bundled caustica-api classes: ${bundledApiClasses}")
        }
    }
}

tasks.named("test", Test) {
    useJUnitPlatform()
    dependsOn(rootProject.tasks.named("bundleSlangRuntime"))
    doFirst {
        def os = org.gradle.internal.os.OperatingSystem.current()
        def arch = System.getProperty("os.arch", "").toLowerCase(Locale.ROOT)
        def platform = os.windows && arch in ["x86_64", "amd64"] ? "windows-x64"
                : os.linux && arch in ["x86_64", "amd64"] ? "linux-x64" : null
        if (platform == null) {
            throw new GradleException("Unsupported Slang test platform ${os}/${arch}")
        }
        def runtime = new File(rootProject.layout.buildDirectory.get().asFile,
                "generated/slang-runtime/caustica/natives/slang/"
                        + "${rootProject.property('slang_runtime_version')}/${platform}")
        systemProperty "caustica.slang.path", runtime.absolutePath
    }
}

tasks.named("check") {
    dependsOn(checkApiBoundary)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named("jar", Jar).configure {
    from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER", "THIRD_PARTY_NOTICES.md")) {
        into "META-INF"
    }
}
