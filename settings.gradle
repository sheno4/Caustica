pluginManagement {
	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		maven {
			name = "NeoForge"
			url = "https://maven.neoforged.net/releases"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "caustica"
include("packages:api", "packages:settings-api", "packages:api-support",
		"extensions:gltf-viewer", "packages:examples:api-showcase")
