pluginManagement {
	includeBuild("packages/slang-tooling")
	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		maven {
			name = "NeoForge"
			url = "https://maven.neoforged.net/releases"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "caustica"
include("packages:api", "packages:engine", "packages:engine-vulkan", "packages:minecraft-api", "packages:minecraft-client", "packages:minecraft-content", "packages:minecraft-rendering", "packages:nvidia-ngx", "packages:nvidia-nrd", "packages:renderer-denoising", "packages:renderer-presentation", "packages:renderer-raytracing", "packages:renderer-runtime", "packages:shader-api", "packages:settings-api", "packages:slang-runtime", "packages:core-support", "packages:vulkan-support",
		"packages:examples:api-showcase", "packages:examples:gltf-content",
		"packages:examples:gltf-viewer-minecraft")
